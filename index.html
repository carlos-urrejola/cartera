<title>Cartera Valdivia</title>
<script>
// Preferencias de este dispositivo: idioma, tema, tamaño de letra y pestaña de inicio.
// "cartera-prefs" = lo que eligió la persona; "cartera-ef" = lo último aplicado,
// que puede venir fijado por el administrador (ver aplicarPrefs).
const PREF_BASE={idioma:"es",tema:"oscuro",letra:"normal",inicio:"resumen"};
function prefsLocal(){
  let p={};try{p=JSON.parse(localStorage.getItem("cartera-prefs")||"{}")||{}}catch(e){}
  if(!p.tema){try{const t=localStorage.getItem("cartera-tema");if(t)p.tema=t}catch(e){}}
  return p;
}
function prefsEf(){try{return JSON.parse(localStorage.getItem("cartera-ef")||"null")||{}}catch(e){return{}}}
function letraAplicar(l){const r=document.documentElement;if(l==="grande"||l==="muygrande")r.setAttribute("data-letra",l);else r.removeAttribute("data-letra")}
function temaAplicar(t){
  const r=document.documentElement;
  if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t==="claro"?"light":"dark");
  const dark=t==="oscuro"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",dark?"#121814":"#18221D");
}
const BOOT={...PREF_BASE,...prefsLocal(),...prefsEf()};
const LANG=BOOT.idioma==="en"?"en":"es";
document.documentElement.lang=LANG;
temaAplicar(BOOT.tema);letraAplicar(BOOT.letra);
</script>

<style>
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E8EDE7; --ink:#18221D; --muted:#56665D; --line:#D3DBD2;
  --beer:#A85F0A; --kom:#00836B; --focus:#00836B;
  --f1:#2a78d6; --f2:#eb6834; --f3:#1baf7a; --seq:#256abf; --hmk:1; --hm-hi:#fff;
  --ok:#23703A; --ok-soft:#DCEFDF; --warn:#8A5A00; --warn-soft:#F8EBC8; --bad:#A8321F; --bad-soft:#F7E0DA; --none:#6B7770; --none-soft:#E6EAE6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#121814; --surface:#1A221D; --surface-2:#243029; --ink:#E6EDE8; --muted:#9AAAA1; --line:#314038;
  --beer:#C9812C; --kom:#2AA088; --focus:#2AA088; --f1:#3987e5; --f2:#d95926; --f3:#199e70; --seq:#3987e5; --hmk:.8; --hm-hi:var(--ink);
  --ok:#6CCB86; --ok-soft:#1B3524; --warn:#E8C067; --warn-soft:#3A3016; --bad:#F08A76; --bad-soft:#3D1F1A; --none:#9AAAA1; --none-soft:#26302A;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121814; --surface:#1A221D; --surface-2:#243029; --ink:#E6EDE8; --muted:#9AAAA1; --line:#314038;
  --beer:#C9812C; --kom:#2AA088; --focus:#2AA088; --f1:#3987e5; --f2:#d95926; --f3:#199e70; --seq:#3987e5; --hmk:.8; --hm-hi:var(--ink);
  --ok:#6CCB86; --ok-soft:#1B3524; --warn:#E8C067; --warn-soft:#3A3016; --bad:#F08A76; --bad-soft:#3D1F1A; --none:#9AAAA1; --none-soft:#26302A;}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs::before,nav.tabs::after{content:"";margin:auto}
nav.tabs button{flex:1 0 auto;min-width:54px;max-width:180px;white-space:nowrap;background:none;border:0;padding:10px 2px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.link{border:0;padding:0;background:none;font-size:15px;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:500}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.sw.beer{background:var(--beer)} .sw.kom{background:var(--kom)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,42px);line-height:1}
.meter{height:12px;border-radius:6px;background:var(--surface-2);display:flex;gap:2px;overflow:hidden}
.meter span{height:100%;display:block}
.meter .b{background:var(--beer)} .meter .k{background:var(--kom)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sem{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.sem i{font-style:normal;font-size:11px}
.sem.ok{background:var(--ok-soft);color:var(--ok)} .sem.warn{background:var(--warn-soft);color:var(--warn)} .sem.bad{background:var(--bad-soft);color:var(--bad)} .sem.none{background:var(--none-soft);color:var(--none)}
.imp{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:700;font-size:13px;border:1.5px solid var(--ink);flex:none}
.imp.A{background:var(--ink);color:var(--bg)} .imp.C{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--muted)}
.item .name{font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip.strong{color:var(--ink);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.week button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.week .d{font-weight:700;font-size:13px}
.week .n{font-family:var(--mono);font-size:18px}
.week .z{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.week .today{font-size:10px;font-weight:700;color:var(--kom)}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.stop.done{opacity:.6}
.stop .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tbox{overflow-x:auto}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:14px;max-height:88vh}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.field textarea{min-height:70px;resize:vertical}
.checks{display:flex;gap:10px 14px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:6px;align-items:center;font-weight:500;font-size:14px}
.line{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;align-items:center}
.line select,.line input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.tot{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.mnav{display:inline-flex;align-items:center;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;z-index:60}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.authbox{max-width:420px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:16px}
input[type=checkbox]{width:auto!important;flex:none}
.btn.link.small{font-size:13px}
.choice{display:grid;gap:10px}
.choice button{padding:16px;text-align:left;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice b{font-size:16px}
.act{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:3px}
.zgrid td,.zgrid th{text-align:center} .zgrid td:first-child,.zgrid th:first-child{text-align:left}
:root[data-letra="grande"] body{zoom:1.12}
:root[data-letra="muygrande"] body{zoom:1.25}
.menu h3{margin-bottom:2px}
.prefrow{display:grid;grid-template-columns:1fr minmax(140px,190px);gap:10px;align-items:center}
.prefrow select,.menu input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.lock{font-size:12px;color:var(--muted)}
.menu form .btn{white-space:nowrap;flex:none}
/* índices: colores validados (paleta categórica, claro y oscuro) */
.sw-beer{background:var(--beer)} .sw-kom{background:var(--kom)} .sw-f1{background:var(--f1)} .sw-f2{background:var(--f2)} .sw-f3{background:var(--f3)} .sw-f0{background:var(--none)}
.hb{display:flex;flex-direction:column;gap:2px}
.hb-row{display:grid;grid-template-columns:minmax(80px,28%) 1fr;gap:10px;align-items:center;padding:4px 6px;border-radius:6px;outline-offset:0}
.hb-row:hover,.hb-row:focus-visible{background:var(--surface-2)}
.hb-lab{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{display:flex;align-items:center;gap:8px;min-width:0}
.hb-bar{display:flex;gap:2px;height:18px;border-radius:0 4px 4px 0;overflow:hidden;flex:none;min-width:3px}
.hb-bar i{display:block;height:100%;min-width:2px}
.hb-val{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.cc-plot{position:relative;height:190px;margin:10px 0 0 46px;border-bottom:1px solid var(--muted)}
.cc-grid{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.cc-grid span{position:absolute;right:calc(100% + 6px);transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.cc-meta{position:absolute;left:0;right:0;border-top:2px solid var(--ink);opacity:.55;z-index:1}
.cc-key{display:inline-block;width:14px;border-top:2px solid var(--ink);opacity:.55}
.cc-cols{position:absolute;inset:0;display:flex;z-index:2}
.cc-slot{flex:1;position:relative;display:flex;justify-content:center;align-items:flex-end;border-radius:4px}
.cc-slot:hover,.cc-slot:focus-visible{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.cc-col{width:min(22px,60%);height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.cc-col i{display:block;width:100%}
.cc-col i:first-child{border-radius:4px 4px 0 0}
.cc-cap{position:absolute;left:0;right:0;text-align:center;margin-bottom:4px;font-family:var(--mono);font-size:11px;color:var(--ink);white-space:nowrap}
.cc-x{display:flex;margin-left:46px;padding-top:4px}
.cc-x span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
details.card summary{cursor:pointer;font-weight:600}
.sw-ok{background:var(--ok)} .sw-warn{background:var(--warn)} .sw-bad{background:var(--bad)}
.hb-row.link{cursor:pointer}
.lnk{cursor:pointer;background:none}
.overlay.confirm{z-index:80;align-items:center}
.overlay.confirm{background:rgba(10,14,12,.6)}
.overlay.confirm .sheet{border-radius:14px;width:calc(100% - 32px);overflow:visible;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35);animation:none}
.semlink{cursor:pointer}
.semlink:hover,.semlink:focus-visible{box-shadow:0 0 0 2px currentColor}
.tarea{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tarea.alta{border-left-color:var(--bad)}
.titem{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.testados{gap:6px;margin-top:6px}
.testados .btn.on{border-color:var(--ink)}
.tbanner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
.tbanner:hover{border-color:var(--muted)}
.compra{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.lnkh{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnkh:hover{text-decoration-color:currentColor}
.kpi-btn{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.kpi-btn:hover{border-color:var(--muted)}
.kpi-btn .val::after{content:" ›";color:var(--muted);font-size:14px}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--surface-2)}
.drow .sub{font-size:12px;color:var(--muted)}
.dsum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.dsum .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
/* mapa de calor: un solo tono, de la superficie (poco) al azul (mucho); 2px de separación entre celdas */
table.hm{border-collapse:separate;border-spacing:0}
table.hm th.c,table.hm td.c{text-align:center;min-width:64px}
table.hm td.c{position:relative;border-bottom:0;padding:9px 6px;font-family:var(--mono);font-size:12px}
table.hm td.c::before{content:"";position:absolute;inset:2px;border-radius:4px;background:var(--seq);opacity:calc(var(--p) * var(--hmk));pointer-events:none}
table.hm td.c span{position:relative}
table.hm td.c.hi{color:var(--hm-hi)}
table.hm td.c:hover::after,table.hm td.c:focus-visible::after{content:"";position:absolute;inset:1px;border-radius:5px;box-shadow:inset 0 0 0 2px var(--ink);pointer-events:none}
.hm-key{display:flex;align-items:center;gap:6px}
.hm-key i{display:block;width:64px;height:10px;border-radius:3px;background:linear-gradient(to right,color-mix(in srgb,var(--seq) 8%,var(--surface)),var(--seq))}
.zgridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fotoloc{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:8px;background:var(--surface-2);min-height:80px}
.zcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:3px}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:13px;pointer-events:none;max-width:280px;line-height:1.35}
@media (max-width:480px){nav.tabs button{font-size:12px;padding-inline:5px}}
/* etiquetas QR de barriles: siempre negro sobre blanco */
#print{display:none}
.etq{--lw:50mm;width:var(--lw);box-sizing:border-box;padding:calc(var(--lw)*.06);border:1px dashed #9aa4a0;border-radius:6px;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;gap:1mm;break-inside:avoid;page-break-inside:avoid;font-family:var(--body)}
.etq svg{display:block;width:100%;height:auto}
.etq .lcod{font-family:var(--mono);font-weight:700;font-size:calc(var(--lw)*.16);line-height:1.05;letter-spacing:.02em}
.etq .lsub{font-size:calc(var(--lw)*.075);line-height:1.15;text-align:center}
@media print{
  @page{margin:10mm}
  html{padding:0!important}

/* RUT chileno: dígito verificador (módulo 11) y formato 12.345.678-9 */
function rutDV(num){let s=0,m=2;for(let i=String(num).length-1;i>=0;i--){s+=Number(String(num)[i])*m;m=m===7?2:m+1}const r=11-(s%11);return r===11?"0":r===10?"K":String(r)}
function rutFormato(num){return String(num).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+rutDV(num)}
function rutLimpio(t){
  const s=String(t||"").toUpperCase().replace(/[^0-9K]/g,"");if(!s)return"";
  const num=s.slice(0,-1),dv=s.slice(-1);
  if(!/^\d{6,8}$/.test(num)||rutDV(num)!==dv)return null;
  return rutFormato(num);
}
/* GPS: acepta "lat, lng" o un link de Google Maps; undefined = texto no válido */
function parseGps(t){
  const s=String(t||"").trim();if(!s)return null;
  const m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m)return undefined;
  const lat=Number(m[1]),lng=Number(m[2]);
  return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat:Math.round(lat*1e6)/1e6,lng:Math.round(lng*1e6)/1e6}:undefined;
}
/* mapa del cliente: usa el punto GPS si lo tiene; si no, la dirección */
function mapsUrl(c,ir=false){
  if(c.gps)return ir?`https://www.google.com/maps/dir/?api=1&destination=${c.gps.lat},${c.gps.lng}`:`https://www.google.com/maps/search/?api=1&query=${c.gps.lat},${c.gps.lng}`;
  return c.direccion?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.direccion+", Valdivia")}`:"";
}
/* fotos: se achican en el teléfono antes de subirlas (máx. 1280 px, JPEG) y se guardan en Supabase Storage (privado) */
async function comprimirFoto(file,max=1280){
  const img=await createImageBitmap(file),k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.75));
}

/* ventanita de confirmación (Sí / No) por encima de todo; devuelve true o false */
function confirmar(titulo,texto,si="Sí",no="No"){

    d.innerHTML=`<div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cfT" style="max-width:420px"><h2 id="cfT">${titulo}</h2>${texto?`<div class="small">${texto}</div>`:""}
      <div class="row" style="justify-content:flex-end"><button class="btn" data-r="0">${no}</button><button class="btn primary" data-r="1">${si}</button></div></div>`;
    const fin=r=>{d.remove();document.removeEventListener("keydown",tecla,true);ok(r)};
    const tecla=e=>{if(e.key==="Escape"){e.stopPropagation();fin(false)}};
    d.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("[data-r]");if(b)fin(b.dataset.r==="1");else if(e.target===d)fin(false)});
    document.addEventListener("keydown",tecla,true);document.body.appendChild(d);d.querySelector('[data-r="1"]').focus();
  });
}

function semCompra(c,marca){
  if(c.estado==="prospecto")return{level:"none",text:"Prospecto, aún sin compras",short:"Prospecto"};
  const vs=ventasDe(c.id).filter(v=>v.marca===marca);
  if(!vs.length)return{level:"none",text:"Sin compras registradas",short:"Sin compras"};
  const last=vs.map(v=>v.fecha).sort().pop();
  const d=days(last,today());
  const f=Number(c.frec?.[marca])||S.cfg.frec[marca]||14;
  return{level:d<=f?"ok":d<=f*1.5?"warn":"bad",text:`Última compra hace ${d} días (esperado cada ${f})`,short:d+" días",dias:d};
}
const semRecompra=c=>worst((c.marcas||[]).map(m=>semCompra(c,m)));
function deudaDe(cid){const t=today();return ventasDe(cid).filter(v=>!v.pagado).map(v=>({v,atraso:days(v.vence||v.fecha,t)}))}
function semPago(c){
  const ds=deudaDe(c.id);
  if(!ds.length)return{level:"ok",text:"Sin facturas pendientes",short:"Sin deuda"};
  const max=Math.max(...ds.map(d=>d.atraso));
  const monto=ds.reduce((s,d)=>s+d.v.neto*1.19,0);
  if(max>S.cfg.tolPago)return{level:"bad",text:`Factura vencida hace ${max} días · ${money(monto)} por cobrar`,short:`Vencida ${max} d`};
  if(max>=0)return{level:"warn",text:max===0?`Vence hoy · ${money(monto)}`:`Vencida hace ${max} días · ${money(monto)}`,short:max===0?"Vence hoy":`Vencida ${max} d`};
  return{level:"ok",text:`${money(monto)} por cobrar, dentro de plazo`,short:"En plazo"};
}
function semSeg(c){
  if(!c.proxFecha)return{level:"none",text:"Sin próxima acción agendada",short:"Sin agendar"};
  const d=days(today(),c.proxFecha);
  if(d<0)return{level:"bad",text:`${c.proxTexto||"Seguimiento"} · atrasado ${-d} días`,short:`Atrasado ${-d} d`};
  if(d===0)return{level:"warn",text:`${c.proxTexto||"Seguimiento"} · hoy`,short:"Hoy"};
  return{level:"ok",text:`${c.proxTexto||"Seguimiento"} · ${fdate(c.proxFecha)}`,short:fdate(c.proxFecha)};
}

/* líquido del mes según litros de cerveza vendidos y neto de kombucha cobrado */
function liquido(litros,cobradoK){
  const c=S.cfg;
  const base=c.imm*c.horas/42, com=litros*c.comL;
  const grat=c.grat?Math.min(.25*(base+com),(4.75*c.imm/12)*(c.horas/42)):0;
  const liqB=(base+com+grat)*(1-c.desc/100);
  const comK=cobradoK*c.pctK/100, liqK=comK*(1-c.ret/100);
  return{base,com,grat,comK,liqB,liqK,total:liqB+liqK};
}
function resumenMes(mes,scope=S.scope){
  const inMes=f=>f&&f.slice(0,7)===mes;
  const mine=x=>scope!=="mias"||x.creado_por===ME.user?.id;
  const vc=S.ventas.filter(v=>v.marca==="cerveza"&&inMes(v.fecha)&&mine(v));
  const vk=S.ventas.filter(v=>v.marca==="kombucha"&&inMes(v.fecha)&&mine(v));
  const litros=vc.reduce((s,v)=>s+(v.litros||0),0);
  const netoC=vc.reduce((s,v)=>s+(v.neto||0),0);
  const cajasK=vk.reduce((s,v)=>s+(v.cajas||0),0);
  const netoK=vk.reduce((s,v)=>s+(v.neto||0),0);
  const cobradoK=S.ventas.filter(v=>v.marca==="kombucha"&&v.pagado&&inMes(v.fechaPago)&&mine(v)).reduce((s,v)=>s+(v.neto||0),0);
  const{com,comK,liqB,liqK}=liquido(litros,cobradoK);
  const am=S.acts.filter(a=>inMes(a.fecha)&&mine(a));
  const visitas=am.filter(a=>PRESENCIAL.has(a.tipo)).length;
  const activ=am.filter(a=>a.tipo==="Activación / degustación").length;
  const mu={};let muC=0,muK=0;
  am.forEach(a=>(a.muestras||[]).forEach(m=>{const k=m.marca+"|"+m.nombre+"|"+(m.unidad||"lata");mu[k]=(mu[k]||0)+m.cant;if(m.marca==="cerveza")muC+=m.cant;else muK+=m.cant}));
  return{litros,netoC,cajasK,netoK,cobradoK,com,comK,liqB,liqK,total:liqB+liqK,nC:vc.length,nK:vk.length,visitas,activ,mu,muC,muK};
}
/* conversión: clientes con activación o muestras en los últimos 60 días que después compraron */
function conversion(){
  const desde=addDays(today(),-60);
  const act=S.acts.filter(a=>a.fecha>=desde&&(a.tipo==="Activación / degustación"||(a.muestras||[]).length));
  const ids=[...new Set(act.map(a=>a.clienteId))];
  const conv=ids.filter(id=>{const first=act.filter(a=>a.clienteId===id).map(a=>a.fecha).sort()[0];return ventasDe(id).some(v=>v.fecha>=first)});
  return{total:ids.length,conv:conv.length};
}

/* ---------- ruta ---------- */
function planDia(fecha){
  const w=String(wday(fecha)), zonasHoy=S.cfg.zonasDia[w]||[];
  const isToday=fecha===today();
  const out=[];
  S.clientes.filter(c=>c.estado!=="pausado"&&(!S.rutaDe||(ownerOf(c)||ME.user?.id)===S.rutaDe)).forEach(c=>{
    const why=[];
    if(c.proxFecha===fecha)why.push({t:c.proxTexto?"Agendado: "+c.proxTexto:"Agendado",k:"agenda"});
    else if(isToday&&c.proxFecha&&c.proxFecha<fecha)why.push({t:"Atrasado: "+(c.proxTexto||"seguimiento"),k:"agenda"});
    if((c.diasVisita||[]).map(String).includes(w))why.push({t:"Día fijo de visita",k:"fijo"});
    const enZona=c.zona&&zonasHoy.includes(c.zona);
    if(enZona){
      const sv=semVisita(c);
      const diasAl=sv.dias===9999?9999:sv.dias+Math.max(0,days(today(),fecha));
      if(diasAl>=sv.f-2)why.push({t:sv.dias===9999?"Nunca visitado":"Toca visita ("+(diasAl)+" d)",k:"toca"});
      const sp=semPago(c);if(sp.level==="bad"||sp.level==="warn")why.push({t:"Cobrar: "+sp.short,k:"cobro"});
      const sr=semRecompra(c);if(sr.level==="bad")why.push({t:"Recompra atrasada",k:"recompra"});
    }
    if(!why.length)return;
    const done=actsDe(c.id).some(a=>a.fecha===fecha&&PRESENCIAL.has(a.tipo));
    const score=({A:30,B:20,C:10})[impOf(c)]+(why.some(x=>x.k==="agenda")?8:0)+(why.some(x=>x.k==="cobro")?5:0)+(why.some(x=>x.k==="recompra")?4:0)+(c.estado==="prospecto"?1:0);
    out.push({c,why,done,score,zona:c.zona||"Sin zona"});
  });
  return{zonasHoy,items:out.sort((a,b)=>b.score-a.score||a.c.nombre.localeCompare(b.c.nombre))};
}

/* ---------- índices (dashboards) ---------- */
S.ix={vista:"productos",periodo:"mes",marca:"todas",formato:"todos",quien:"todos",medida:"litros",modo:"juntos",zmodo:"mezcla"};
const MARCA_SW={cerveza:"beer",kombucha:"kom"};
const FMT_SW={barril:"f1",caja:"f2",lata:"f3",otro:"f0"};
function ixRango(p){
  const t=today(),m=t.slice(0,7);
  if(p==="mes")return[m+"-01",t];
  if(p==="mesAnt"){const a=shiftMes(m,-1);return[a+"-01",a+"-31"]}
  if(p==="3m")return[shiftMes(m,-2)+"-01",t];
  if(p==="anio")return[t.slice(0,4)+"-01-01",t];
  return["0000-01-01","9999-12-31"];
}
function infoItem(it){
  const p=S.cfg.productos.find(x=>x.id===it.prodId),g=infoDeNombre(it.nombre||p?.nombre||"");
  return{formato:it.formato||p?.formato||g.formato,estilo:it.estilo||p?.estilo||g.estilo};
}
/* una fila por producto vendido, con los filtros de Índices aplicados */
function ixLineas(periodo=S.ix.periodo){
  const x=S.ix,[d,h]=ixRango(periodo);
  const out=[];
  S.ventas.filter(v=>v.fecha>=d&&v.fecha<=h&&(x.marca==="todas"||v.marca===x.marca)&&(x.quien==="todos"||v.creado_por===x.quien)).forEach(v=>
    (v.items||[]).forEach(it=>{const i=infoItem(it);if(x.formato!=="todos"&&i.formato!==x.formato)return;
      const cl=S.clientes.find(c=>c.id===v.clienteId);
      out.push({marca:v.marca,...i,clienteId:v.clienteId,fecha:v.fecha,venta:v.id,zona:cl?.zona||"Sin zona",unidades:it.cant||0,litros:(it.cant||0)*(it.litrosU||0),neto:(it.cant||0)*(it.netoU||0)})}));
  return out;
}
const ixFmt=(n,m)=>m==="neto"?money(n):m==="unidades"?n1(n)+" u.":m==="cuenta"?n1(n):n1(n)+" L";
/* barras horizontales apiladas: filas [{lab,segs:[{k,sw,v,nombre}]}] */
function hbars(filas,medida){
  const max=Math.max(...filas.map(f=>f.segs.reduce((s,x)=>s+x.v,0)),0)||1;
  return `<div class="hb">${filas.map(f=>{const tot=f.segs.reduce((s,x)=>s+x.v,0);const segs=f.segs.filter(x=>x.v>0);
    const tip=`${f.lab}: ${ixFmt(tot,medida)}${segs.length>1?" · "+segs.map(x=>`${x.nombre}: ${ixFmt(x.v,medida)}`).join(" · "):""}`;
    const link=f.act?` data-act="${f.act}" data-k="${esc(f.arg)}"`:f.id?` data-act="openClient" data-id="${f.id}"`:"";
    return `<div class="hb-row${link?" link":""}" tabindex="0" data-tip="${esc(tip)}"${link}><span class="hb-lab" title="${esc(f.lab)}">${esc(f.lab)}</span><span class="hb-track"><span class="hb-bar" style="width:${tot/max*82}%">${segs.map(x=>`<i class="sw-${x.sw}" style="flex:${x.v}"></i>`).join("")}</span><span class="hb-val">${ixFmt(tot,medida)}</span></span></div>`}).join("")}</div>`;
}

/* ---------- tendencia en el tiempo: semana, 15 días, mes o estación (hemisferio sur) ---------- */
S.gran="mes";
const ESTACIONES=LANG==="en"?["Summer","Autumn","Winter","Spring"]:["Verano","Otoño","Invierno","Primavera"];
const GRANS=[["semana","Semana"],["quincena","15 días"],["mes","Mes"],["estacion","Estación"]];
// verano = dic-feb (diciembre cuenta para el verano del año siguiente), otoño = mar-may, invierno = jun-ago, primavera = sep-nov
function estacionDe(f){const y=Number(f.slice(0,4)),m=Number(f.slice(5,7));return{i:m===12||m<=2?0:m<=5?1:m<=8?2:3,y:m===12?y+1:y}}
function periodoDe(f,g){
  if(g==="semana")return weekStart(f);
  if(g==="quincena")return f.slice(0,7)+(Number(f.slice(8,10))<=15?"-1":"-2");
  if(g==="mes")return f.slice(0,7);
  const e=estacionDe(f);return e.y+"-"+e.i;
}
function periodos(g){
  const t=today(),out=[];
  if(g==="semana"){let w=weekStart(t);for(let i=0;i<16;i++){out.unshift(w);w=addDays(w,-7)}}
  else if(g==="quincena"){let m=t.slice(0,7),h=Number(t.slice(8,10))<=15?1:2;for(let i=0;i<12;i++){out.unshift(m+"-"+h);if(h===2)h=1;else{h=2;m=shiftMes(m,-1)}}}
  else if(g==="mes"){for(let i=11;i>=0;i--)out.push(shiftMes(t.slice(0,7),-i))}
  else{let{i,y}=estacionDe(t);for(let k=0;k<8;k++){out.unshift(y+"-"+i);if(--i<0){i=3;y--}}}
  return out;
}
function etiquetaPeriodo(k,g,corta){
  if(g==="semana")return corta?fdate(k).slice(0,5):"Semana del "+fdate(k);
  if(g==="quincena"){const[y,m,h]=k.split("-");return(h==="1"?"1ª ":"2ª ")+MESES[m-1].slice(0,3)+(corta?"":" "+y)}
  if(g==="mes")return corta?MESES[Number(k.slice(5))-1].slice(0,3):mesLabel(k);
  const[y,i]=k.split("-");return corta?ESTACIONES[i].slice(0,3)+" "+y.slice(2):ESTACIONES[i]+" "+y;
}
const granSeg=()=>`<div class="seg" role="group" aria-label="Agrupar por">${GRANS.map(([k,l])=>`<button data-act="gran" data-v="${k}" aria-pressed="${S.gran===k}">${l}</button>`).join("")}</div>`;
/* columnas apiladas por marca, una por período; lineas: [{fecha,marca,litros,unidades,neto}] */
function tendencia(lineas,medida){
  const g=S.gran,keys=periodos(g);
  const cols=keys.map(k=>{const rs=lineas.filter(r=>r.fecha&&periodoDe(r.fecha,g)===k);return{k,n:new Set(rs.map(r=>r.venta)).size,c:sumM(rs.filter(r=>r.marca==="cerveza"),medida),kb:sumM(rs.filter(r=>r.marca==="kombucha"),medida)}});
  const top=Math.max(...cols.map(x=>x.c+x.kb),0);
  if(!top)return `<div class="muted small">Sin compras en este período.</div>`;
  const paso=pasoLindo(top*1.05/4),ymax=Math.ceil(top*1.05/paso)*paso,ticks=[];for(let v=0;v<=ymax+1e-9;v+=paso)ticks.push(v);
  const pct=v=>v/ymax*100,fmt=v=>medida==="neto"?moneyK(v):n1(v);
  const cada=keys.length>12?2:1,mayor=cols.reduce((a,b)=>b.c+b.kb>a.c+a.kb?b:a);
  const marcas=[cols.some(x=>x.c)&&["beer","Cerveza"],cols.some(x=>x.kb)&&["kom","Kombucha"]].filter(Boolean);
  return `${leyenda(marcas)}<div class="cc" role="img" aria-label="Tendencia por ${g}">
    <div class="cc-plot">${ticks.map(v=>`<div class="cc-grid" style="bottom:${pct(v)}%"><span>${fmt(v)}</span></div>`).join("")}
      <div class="cc-cols">${cols.map(x=>`<div class="cc-slot" tabindex="0" data-tip="${esc(`${etiquetaPeriodo(x.k,g)}: ${ixFmt(x.c+x.kb,medida)} · ${x.n} ${x.n===1?"compra":"compras"}${x.c&&x.kb?` · Cerveza: ${ixFmt(x.c,medida)} · Kombucha: ${ixFmt(x.kb,medida)}`:""}`)}">${x===mayor?`<span class="cc-cap" style="bottom:${pct(x.c+x.kb)}%">${fmt(x.c+x.kb)}</span>`:""}<div class="cc-col">${x.kb?`<i class="sw-kom" style="height:${pct(x.kb)}%"></i>`:""}${x.c?`<i class="sw-beer" style="height:${pct(x.c)}%"></i>`:""}</div></div>`).join("")}</div></div>
    <div class="cc-x">${cols.map((x,i)=>`<span>${(keys.length-1-i)%cada===0?etiquetaPeriodo(x.k,g,true):""}</span>`).join("")}</div></div>`;
}
/* estilos × estación (todos los años juntos): qué parte de lo vendido en cada estación es de cada estilo */
function estilosPorEstacion(lineas,medida){
  if(!lineas.length)return"";
  const est=lineas.map(r=>({...r,e:estacionDe(r.fecha).i}));
  const totE=[0,1,2,3].map(i=>sumM(est.filter(r=>r.e===i),medida));
  const estilos=[...new Set(est.map(r=>r.marca+"|"+r.estilo))].map(k=>[k,sumM(est.filter(r=>r.marca+"|"+r.estilo===k),medida)]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  const sh=(k,i)=>totE[i]?sumM(est.filter(r=>r.marca+"|"+r.estilo===k&&r.e===i),medida)/totE[i]:0;
  let max=0;estilos.forEach(k=>[0,1,2,3].forEach(i=>max=Math.max(max,sh(k,i))));max=max||1;
  const conDatos=[0,1,2,3].filter(i=>totE[i]>0),total=totE.reduce((a,b)=>a+b,0);
  const mejor=conDatos.sort((a,b)=>totE[b]-totE[a])[0];
  const lideres=[0,1,2,3].filter(i=>totE[i]>0).map(i=>{const k=estilos.slice().sort((a,b)=>sh(b,i)-sh(a,i))[0];return `${ESTACIONES[i]}: <b>${esc(k.split("|")[1])}</b>`});
  return `<section class="card stack"><div><h3>Estilos por estación</h3><div class="muted small">% de lo vendido en cada estación · todos los años juntos</div></div>
    <div class="tbox"><table class="hm"><thead><tr><th>Estilo</th>${[0,1,2,3].map(i=>`<th class="c">${ESTACIONES[i]}</th>`).join("")}</tr></thead><tbody>
    ${estilos.map(k=>{const[mk,e]=k.split("|");return `<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap"><i class="sw ${MARCA_SW[mk]}"></i><button class="lnkh" data-act="drill" data-k="${esc("estilo:"+k)}">${esc(e)}</button></span></td>${[0,1,2,3].map(i=>{const s=sh(k,i),p=s/max;
      return `<td class="c${p>=.78?" hi":""}" style="--p:${p.toFixed(3)}" tabindex="0" data-tip="${esc(`${e} · ${ESTACIONES[i]}: ${pctTxt(s)}`)}"><span>${totE[i]?(s?pctTxt(s):"–"):"·"}</span></td>`}).join("")}</tr>`}).join("")}
    </tbody></table></div>
    <div class="small">${mejor!==undefined?`Tu estación más fuerte: <b>${ESTACIONES[mejor]}</b> (${pctTxt(totE[mejor]/total)} del volumen). `:""}Lo que más sale · ${lideres.join(" · ")}</div>
    ${conDatos.length<4?`<div class="muted small">Aún faltan datos de ${[0,1,2,3].filter(i=>!totE[i]).map(i=>ESTACIONES[i]).join(", ")}: el cuadro se completa a medida que pase el año.</div>`:""}
  </section>`;
}
function ixTendencia(){
  const m=S.ix.medida,L=ixLineas("todo");
  if(!L.length)return `<div class="card empty">No hay ventas con estos filtros.</div>`;
  return `<section class="card stack"><div class="row spread"><div><h3>Ventas en el tiempo</h3><div class="muted small">${m==="neto"?"Neto":m==="unidades"?"Unidades":"Litros"} por ${GRANS.find(x=>x[0]===S.gran)[1].toLowerCase()}</div></div>${granSeg()}</div>${tendencia(L,m)}</section>

/* zonas: mapa de calor zona × estilo, por marca, y qué ofrecer en cada zona */
const sumM=(arr,m)=>arr.reduce((s,r)=>s+r[m],0);
const pctTxt=v=>Math.round(v*100)+"%";
function heatmap(marca,L,m,modo){
  const rs=L.filter(r=>r.marca===marca);if(!rs.length)return"";
  const total=sumM(rs,m)||1;
  const estilos=[...new Set(rs.map(r=>r.estilo))].map(e=>[e,sumM(rs.filter(r=>r.estilo===e),m)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const shG=Object.fromEntries(estilos.map(e=>[e,sumM(rs.filter(r=>r.estilo===e),m)/total]));
  const orden=[...S.cfg.zonas,"Sin zona"],pos=z=>{const i=orden.indexOf(z);return i<0?99:i};
  const zonas=[...new Set(rs.map(r=>r.zona))].sort((a,b)=>pos(a)-pos(b));
  const totZ=Object.fromEntries(zonas.map(z=>[z,sumM(rs.filter(r=>r.zona===z),m)]));
  const val=(z,e)=>sumM(rs.filter(r=>r.zona===z&&r.estilo===e),m);
  const esc2=(z,e)=>{const v=val(z,e);return{v,sh:totZ[z]?v/totZ[z]:0}};
  let max=0;zonas.forEach(z=>estilos.forEach(e=>{const c=esc2(z,e);max=Math.max(max,modo==="mezcla"?c.sh:c.v)}));max=max||1;
  const corto=v=>m==="neto"?moneyK(v):n1(v);
  const tabla=`<div class="tbox"><table class="hm"><thead><tr><th>Zona</th>${estilos.map(e=>`<th class="c"><button class="lnkh" data-act="drill" data-k="${esc("estilo:"+marca+"|"+e)}">${esc(e)}</button></th>`).join("")}<th class="r">Total</th></tr></thead><tbody>
    ${zonas.map(z=>`<tr><td>${z==="Sin zona"?esc(z):`<button class="lnkh" data-act="drill" data-k="${esc("zona:"+z)}">${esc(z)}</button>`}</td>${estilos.map(e=>{const c=esc2(z,e),p=(modo==="mezcla"?c.sh:c.v)/max;
      return `<td class="c${p>=.78?" hi":""}" style="--p:${p.toFixed(3)};cursor:pointer" tabindex="0" data-act="drill" data-k="${esc("estilo:"+marca+"|"+e)}" data-tip="${esc(`${z} · ${e}: ${pctTxt(c.sh)} · ${ixFmt(c.v,m)}`)}"><span>${c.v?(modo==="mezcla"?pctTxt(c.sh):corto(c.v)):"–"}</span></td>`}).join("")}<td class="r num">${ixFmt(totZ[z],m)}</td></tr>`).join("")}
  </tbody></table></div>`;
  // lectura: lo que más sale en cada zona y qué estilos conviene ofrecer
  const tops=Object.fromEntries(zonas.map(z=>[z,estilos.map(e=>[e,esc2(z,e).sh]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0)]));
  const favoritos={};zonas.forEach(z=>{const t=tops[z][0];if(t)favoritos[t[0]]=(favoritos[t[0]]||0)+1});
  const [fav,nFav]=Object.entries(favoritos).sort((a,b)=>b[1]-a[1])[0]||[];
  const ofrecer=z=>estilos.filter(e=>shG[e]>=.1&&esc2(z,e).sh<shG[e]/3).slice(0,3);
  const sinVentas=S.cfg.zonas.filter(z=>!zonas.includes(z));
  const lectura=`<div class="stack" style="gap:8px">
    ${zonas.length>1&&fav?`<div class="small"><b>${esc(fav)}</b> es lo más vendido en ${nFav} de ${zonas.length} zonas.</div>`:""}
    <div class="zgridcards">${zonas.map(z=>{const o=ofrecer(z);return `<div class="zcard">${z==="Sin zona"?`<b>${esc(z)}</b>`:`<button class="lnkh" style="font-weight:700;text-align:left" data-act="drill" data-k="${esc("zona:"+z)}">${esc(z)} ›</button>`}
      <div class="small">Lo que más sale: ${tops[z].slice(0,2).map(([e,s])=>`${esc(e)} (${pctTxt(s)})`).join(", ")}</div>
      ${o.length?`<div class="small">Para ofrecer: <b>${o.map(esc).join(", ")}</b></div>`:""}</div>`}).join("")}</div>
    ${sinVentas.length?`<div class="small muted">Zonas sin ventas en este período: ${sinVentas.map(esc).join(", ")}. Buena oportunidad para llevar ${estilos.slice(0,2).map(esc).join(" y ")}.</div>`:""}
    <div class="muted small">"Para ofrecer" son estilos que se venden bien en general pero poco o nada en esa zona.</div>
  </div>`;
  return `<section class="card stack"><div class="row spread"><div><h3><span class="row" style="gap:6px"><i class="sw ${MARCA_SW[marca]}"></i>${marca==="cerveza"?"Cerveza por zona":"Kombucha por zona"}</span></h3>
    <div class="muted small">${modo==="mezcla"?"% de lo vendido en cada zona":"Cantidad vendida"} · ${m==="neto"?"neto":m==="unidades"?"unidades":"litros"}</div></div>
    <div class="hm-key small muted"><span>Menos</span><i></i><span>Más</span></div></div>
    ${tabla}${lectura}</section>`;
}
function ixZonas(){
  const x=S.ix,L=ixLineas();
  if(!L.length)return `<div class="card empty">No hay ventas con estos filtros.<span class="small">Prueba con otro período o registra una venta.</span></div>`;

    h=dHdr("Desglose del sueldo",mes)+`<section class="card"><div class="dsum">
      ${fila(`Sueldo base (${c.horas} de 42 h)`,money(L.base))}${fila(`Comisión cerveza (${n1(r.litros)} L × ${money(c.comL)})`,money(L.com))}
      ${c.grat?fila("Gratificación legal",money(L.grat)):""}${fila(`Descuentos legales (${c.desc}%)`,"−"+money(bruto*c.desc/100))}
      ${fila("Líquido El Growler",money(L.liqB),"tot")}
      ${fila("Kombucha cobrada en el mes (neto)",money(r.cobradoK))}${fila(`Comisión kombucha (${c.pctK}%)`,money(L.comK))}${fila(`Retención boleta (${c.ret}%)`,"−"+money(L.comK*c.ret/100))}
      ${fila("Líquido kombucha",money(L.liqK),"tot")}
      ${fila("Total estimado",money(L.total),"tot")}${fila("Meta",money(c.meta))}${fila(L.total>=c.meta?"Sobre la meta":"Falta para la meta",money(Math.abs(c.meta-L.total)))}
    </div></section>
    ${topC.length?`<section class="card stack"><div><h3>Quién aporta tu comisión de cerveza</h3><div class="muted small">Comisión bruta por cliente este mes</div></div>${hbars(topC,"neto")}</section>`:""}
    <button class="btn" data-act="goIx" data-v="sueldo">Ver Índices › Sueldo y meta</button>`;
  }
  else if(k==="cerveza")h=dHdr("Cerveza vendida",mes)+dVentasMarca("cerveza");
  else if(k==="kombucha")h=dHdr("Kombucha vendida",mes)+dVentasMarca("kombucha");
  else if(k==="cobrar"){
    const t=today(),pend=S.ventas.filter(v=>!v.pagado);
    const ids=[...new Set(pend.map(v=>v.clienteId))].map(id=>{const ps=pend.filter(v=>v.clienteId===id);return{id,monto:ps.reduce((s,v)=>s+(v.neto||0)*1.19,0),n:ps.length,max:Math.max(...ps.map(v=>days(v.vence||v.fecha,t)))}}).sort((a,b)=>b.max-a.max||b.monto-a.monto);
    const tot=ids.reduce((s,x)=>s+x.monto,0);
    h=dHdr("Por cobrar",`${money(tot)} con IVA · ${pend.length} facturas`)+(ids.length?`<section class="card">${ids.map(x=>{const s=x.max>c.tolPago?{level:"bad",short:`Vencida ${x.max} d`}:x.max>=0?{level:"warn",short:x.max===0?"Vence hoy":`Vencida ${x.max} d`}:{level:"ok",short:"En plazo"};
      return dFila(x.id,`${x.n} ${x.n===1?"factura":"facturas"}`,`<span class="num small">${money(x.monto)}</span><br>${pill(s)}`)}).join("")}</section>
      <button class="btn" data-act="goIx" data-v="cobranza">Ver Índices › Cobranza</button>`:`<div class="empty">No hay facturas por cobrar.</div>`);
  }
  else if(k==="clientes"){
    const st=S.drillSub,cs=S.clientes.filter(x=>x.estado===st).sort((a,b)=>impOf(a).localeCompare(impOf(b))||a.nombre.localeCompare(b.nombre));
    const n=e=>S.clientes.filter(x=>x.estado===e).length;
    h=dHdr("Clientes")+`<div class="seg" role="group" aria-label="Estado">${Object.entries(ESTADOS).map(([e,l])=>`<button data-act="drillSub" data-v="${e}" aria-pressed="${st===e}">${l} (${n(e)})</button>`).join("")}</div>
      ${cs.length?`<section class="card">${cs.map(x=>dFila(x.id,[x.zona,x.tipo,ultimaCompra(x.id)].filter(Boolean).map(esc).join(" · "),pill(worst([semPago(x),semRecompra(x),semSeg(x),semVisita(x)])))).join("")}</section>`:`<div class="empty">No hay clientes en este estado.</div>`}`;
  }
  else if(k==="ruta"){
    const p=planDia(today()),pend=p.items.filter(i=>!i.done);
    h=dHdr(`Ruta de hoy`,`${DIAS_L[wday(today())]} · ${pend.length} por visitar de ${p.items.length}`)+(pend.length?`<section class="card">${pend.map(it=>dFila(it.c.id,[it.zona,...it.why.map(w=>w.t)].map(esc).join(" · "),pill(semVisita(it.c)))).join("")}</section>`:`<div class="empty">Nada pendiente para hoy.</div>`)+`<button class="btn primary" data-tab="ruta">Ir a la ruta</button>`;

  else if(k==="visitas"){
    const as=S.acts.filter(a=>dMes(a.fecha)&&dMine(a)&&!esTarea(a)).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const tipos=[...new Set(as.map(a=>a.tipo))].map(t=>({lab:t,segs:[{k:t,sw:"f1",nombre:t,v:as.filter(a=>a.tipo===t).length}]})).sort((a,b)=>b.segs[0].v-a.segs[0].v);

  }
  openSheet(`<div class="drill stack">${h}</div>`);
}

/* análisis de compras en la ficha del cliente */
function analisisCliente(cl){
  const vs=ventasDe(cl.id).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")),plata=can("ver_cobranza");
  const catalogo=[...new Set(S.cfg.productos.filter(p=>(cl.marcas||[]).includes(p.marca)).map(p=>p.estilo).filter(Boolean))];
  if(!vs.length)return `<div class="card stack" style="gap:6px"><h3>Compras</h3><div class="muted small">Aún no compra.${catalogo.length?` Para partir, ofrécele: ${catalogo.slice(0,4).map(esc).join(", ")}.`:""}</div></div>`;
  const L=vs.flatMap(v=>(v.items||[]).map(it=>({marca:v.marca,...infoItem(it),cant:it.cant||0,litros:(it.cant||0)*(it.litrosU||0),neto:(it.cant||0)*(it.netoU||0),venta:v.id,fecha:v.fecha})));
  const litros=sumM(L,"litros"),neto=sumM(L,"neto");
  const fechas=[...new Set(vs.map(v=>v.fecha).filter(Boolean))].sort();
  const cada=fechas.length>1?days(fechas[0],fechas.at(-1))/(fechas.length-1):null,hace=days(fechas.at(-1),today());
  const prods=[...new Set(L.map(r=>r.marca+"|"+r.estilo+"|"+r.formato))].map(k=>{const[mk,e,f]=k.split("|"),rs=L.filter(r=>r.marca===mk&&r.estilo===e&&r.formato===f);
    return{mk,lab:`${e} · ${FORMATOS[f]||f}`,estilo:e,litros:sumM(rs,"litros"),cant:sumM(rs,"cant"),veces:new Set(rs.map(r=>r.venta)).size}}).sort((a,b)=>b.litros-a.litros);
  const comprados=new Set(prods.map(p=>p.estilo)),nunca=catalogo.filter(e=>!comprados.has(e));
  const porEst=[0,1,2,3].map(i=>sumM(L.filter(r=>r.fecha&&estacionDe(r.fecha).i===i),"litros")),estTop=porEst.indexOf(Math.max(...porEst));
  const pag=vs.filter(v=>v.pagado&&v.fechaPago),diasPago=pag.length?pag.reduce((s,v)=>s+Math.max(0,days(v.fecha,v.fechaPago)),0)/pag.length:null;
  const menos=prods.length>1?prods.at(-1):null;
  return `<div class="card stack"><h3>Compras</h3>
    <div class="kpis">
      <div class="kpi"><span class="lab">Compras</span><span class="val">${vs.length}</span><span class="muted small">${n1(litros)} L en total</span></div>
      <div class="kpi"><span class="lab">Frecuencia</span><span class="val">${cada===null?"—":"cada "+Math.round(cada)+" d"}</span><span class="muted small">Última hace ${hace} días</span></div>
      ${plata?`<div class="kpi"><span class="lab">Ticket promedio</span><span class="val">${money(neto/vs.length)}</span><span class="muted small">${money(neto)} neto en total</span></div>`:""}
      ${diasPago!==null?`<div class="kpi"><span class="lab">Paga en</span><span class="val">${n1(diasPago)} días</span><span class="muted small">promedio</span></div>`:""}
    </div>
    <div class="stack" style="gap:4px">
      <div class="small"><b>Lo que más compra:</b> ${esc(prods[0].lab)} (${n1(prods[0].litros)} L en ${prods[0].veces} ${prods[0].veces===1?"compra":"compras"})</div>
      ${menos?`<div class="small"><b>Lo que menos compra:</b> ${esc(menos.lab)} (${n1(menos.litros)} L)</div>`:""}
      ${nunca.length?`<div class="small"><b>Nunca ha comprado:</b> ${nunca.slice(0,5).map(esc).join(", ")} · para ofrecerle</div>`:""}
      ${porEst.filter(Boolean).length>1?`<div class="small"><b>Compra más en:</b> ${ESTACIONES[estTop]} (${pctTxt(porEst[estTop]/litros)} de sus litros)</div>`:""}
    </div>
    <div><div class="muted small" style="margin-bottom:4px">Productos (litros)</div>${hbars(prods.map(p=>({lab:p.lab,act:"drill",arg:"estilo:"+p.mk+"|"+p.estilo,segs:[{k:p.mk,sw:MARCA_SW[p.mk],nombre:p.mk,v:p.litros}]})),"litros")}</div>
    <div class="stack" style="gap:6px"><div class="row spread"><span class="muted small">Litros en el tiempo</span>${granSeg()}</div>${tendencia(L,"litros")}</div>
  </div>`;
}

/* ---------- barriles: seguimiento con un QR fijo en cada barril ----------
   El QR solo lleva un enlace con el código del barril (…/#b=B-001). Estilo, lote, fecha de
   embarrilado, cliente, factura y días viven en la base de datos (tabla barriles) y se
   actualizan en cada movimiento: por eso el mismo QR sirve para siempre.
   Ciclo: por lavar → limpio → lleno → en cliente → vuelve por lavar. */
const B_EST={vacio:"Vacío · por lavar",limpio:"Limpio · listo para llenar",lleno:"Lleno en bodega",en_cliente:"En cliente",interno:"En uso interno",baja:"Fuera de servicio"};
const B_CAP=[30,50,20];
const litB=b=>Number(b.litros)||30;
const enUso=b=>b.estado==="en_cliente"||b.estado==="interno";
const B_ACC={alta:"Alta",lavado:"Lavado",llenado:"Embarrilado",entrega:"Entregado",interno:"A uso interno",retiro:"Retirado vacío",edicion:"Editado",baja:"Fuera de servicio",reactivado:"Vuelve a usarse"};
S.barriles=[];S.bFiltro="en_cliente";S.bq="";S.bLit="todos";S.barrilAbierto=null;S.barrilErr=null;
const verBarriles=()=>can("ver_barriles")||can("gestionar_barriles");
const moverBarriles=()=>can("gestionar_barriles")&&!S.offline&&!S.barrilErr;
const codigoLimpio=t=>String(t||"").trim().toUpperCase().replace(/\s+/g,"");
function codigoDe(txt){const s=String(txt||"").trim();const m=s.match(/[#?&]b=([^&#\s]+)/i);return codigoLimpio(m?decodeURIComponent(m[1]):s)}
function codigoHash(){const m=location.hash.match(/[#&]b=([^&]+)/);return m?codigoLimpio(decodeURIComponent(m[1])):null}
const urlBarril=c=>location.origin+location.pathname+"#b="+encodeURIComponent(c);
const barrilDe=cod=>S.barriles.find(b=>b.codigo===cod);
const bOrden=(a,b)=>a.codigo.localeCompare(b.codigo,"es",{numeric:true});
function semBarril(b){
  const t=today();
  if(b.estado==="en_cliente"&&b.fechaEntrega){const d=days(b.fechaEntrega,t),f=S.cfg.barrilDias||30;
    return{level:d<=f?"ok":d<=f*1.5?"warn":"bad",short:`${d} d en cliente`,text:`Entregado el ${fdate(b.fechaEntrega)} · máximo ${f} días en el local`,dias:d}}
  if(b.estado==="lleno"){const d=b.fechaEmbarrilado?days(b.fechaEmbarrilado,t):0,f=S.cfg.barrilFresco||60;

function qrSvg(texto){
  const q=qrcode(0,"M");q.addData(texto);q.make();
  const n=q.getModuleCount(),m=2,W=n+2*m;let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${W} ${W}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="${W}" height="${W}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

function bRango(pre,desde,cant){
  pre=codigoLimpio(pre);desde=Math.max(0,Math.floor(desde||0));cant=Math.floor(cant||0);if(cant<1)return[];
  const pad=Math.max(3,String(desde+cant-1).length);return Array.from({length:cant},(_,i)=>pre+String(desde+i).padStart(pad,"0"));
}

function imprimirEtiquetas(ids,mm){
  const B=ids.map(id=>S.barriles.find(b=>b.id===id)).filter(Boolean).sort(bOrden);if(!B.length){toast("Elige al menos un barril");return}
  let p=$("#print");if(!p){p=document.createElement("div");p.id="print";document.body.appendChild(p)}
  p.style.setProperty("--lw",mm+"mm");
  p.innerHTML=B.map(b=>`<div class="etq">${etiquetaHtml(b)}</div>`).join("");
  document.body.classList.add("printing");
  const fin=()=>{document.body.classList.remove("printing");window.removeEventListener("afterprint",fin)};
  window.addEventListener("afterprint",fin);
  setTimeout(()=>window.print(),60);
}
/* escáner dentro de la app (Android/Chrome). En iPhone se usa la cámara normal: el QR abre el enlace. */
let SCAN=null;
function scanStop(){if(SCAN){SCAN.on=false;SCAN.stream?.getTracks().forEach(t=>t.stop());SCAN=null}}
async function escanear(){
  if(!verBarriles()){toast("No tienes acceso al seguimiento de barriles");return}
  openSheet(`<div class="row spread"><h2>Buscar barril</h2><button class="btn sm" data-act="close">Cerrar</button></div>
    <div class="stack" style="gap:8px"><video id="scanVid" playsinline muted style="width:100%;max-height:52vh;border-radius:10px;background:#000;object-fit:cover"></video><div id="scanMsg" class="muted small">Apunta la cámara al QR o al código de barras del barril.</div></div>
    <form id="codigoForm" class="row" style="flex-wrap:nowrap"><input id="codigoIn" placeholder="O escribe el código, ej: B-001" aria-label="Código del barril" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><button class="btn primary" type="submit">Buscar</button></form>`);
  const vid=$("#scanVid"),msg=$("#scanMsg");
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){vid.remove();msg.innerHTML="Este navegador no lee códigos dentro de la app. Usa la <b>cámara normal del teléfono</b>: apunta al QR del barril y toca el enlace que aparece. O escribe el código abajo.";return}
  try{
    const fm=await BarcodeDetector.getSupportedFormats();
    const det=fm.length?new BarcodeDetector({formats:fm}):new BarcodeDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    if(!document.body.contains(vid)){stream.getTracks().forEach(t=>t.stop());return}
    SCAN={on:true,stream};vid.srcObject=stream;await vid.play();
    const loop=async()=>{if(!SCAN?.on)return;
      try{const r=await det.detect(vid);if(r.length){const v=r[0].rawValue;scanStop();navigator.vibrate?.(60);abrirCodigo(v);return}}catch(e){}
      setTimeout(loop,250)};
    loop();
  }catch(e){scanStop();vid.remove();msg.innerHTML=e?.name==="NotAllowedError"?"Falta dar permiso de cámara al navegador. También puedes escribir el código abajo.":"No se pudo abrir la cámara. Escribe el código abajo o usa la cámara normal del teléfono."}
}
async function abrirCodigo(txt){
  const cod=codigoDe(txt);if(!cod)return;
  if(!verBarriles()){toast("No tienes acceso al seguimiento de barriles");return}
  const b=barrilDe(cod);
  if(b){navPush();barrilSheet(b.id);return}
  closeSheet();
  if(moverBarriles()){if(await confirmar(`No existe el barril ${esc(cod)}`,"¿Quieres registrarlo como barril nuevo con ese código?","Sí, registrar","No"))bNuevoForm(cod)}
  else toast(`No encontré el barril ${cod}`);
}

  history.replaceState(null,"",location.pathname+location.search);abrirCodigo(c);
}

/* caja mixta: una caja de 24 latas con varios estilos de la misma marca */
const LATAS_CAJA=24;
const cajasDe=m=>S.cfg.productos.filter(p=>p.marca===m&&(p.formato||infoDeNombre(p.nombre).formato)==="caja");
function addMix(n=1,filas=null){
  const m=$("#sMarca").value,ps=cajasDe(m);
  if(!ps.length){toast("No hay cajas de "+m+" en el catálogo (Ajustes → Productos)");return}
  const d=document.createElement("div");d.className="mix card stack";d.dataset.mix="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  d.innerHTML=`<div class="row spread"><b>Caja mixta de ${LATAS_CAJA} latas</b><button type="button" class="btn sm" data-act="delMix" aria-label="Quitar caja mixta">✕</button></div>
    <div class="row"><label class="small" style="display:flex;gap:6px;align-items:center">Cantidad de cajas <input type="number" class="mixN" min="1" step="1" value="${n}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"></label></div>
    <div class="mixRows stack" style="gap:6px"></div>
    <div class="row spread"><button type="button" class="btn sm" data-act="addMixRow">+ Estilo</button><span class="mixCont small"></span></div>`;
  $("#mixes").appendChild(d);
  (filas||[{prodId:ps[0].id,latas:LATAS_CAJA/2},{prodId:(ps[1]||ps[0]).id,latas:LATAS_CAJA/2}]).forEach(f=>addMixRow(d,f));
  mixContador(d);
}
function addMixRow(box,f={prodId:"",latas:0}){
  const ps=cajasDe($("#sMarca").value),r=document.createElement("div");r.className="line";
  r.innerHTML=`<select aria-label="Estilo">${ps.map(p=>`<option value="${p.id}"${p.id===f.prodId?" selected":""}>${esc(p.estilo||infoDeNombre(p.nombre).estilo)}</option>`).join("")}</select><input type="number" min="0" max="${LATAS_CAJA}" step="1" value="${f.latas}" aria-label="Latas"><button type="button" class="btn sm" data-act="delLine" aria-label="Quitar estilo">✕</button>`;
  box.querySelector(".mixRows").appendChild(r);
}
function mixSuma(box){return[...box.querySelectorAll(".mixRows input")].reduce((s,i)=>s+(Number(i.value)||0),0)}
function mixContador(box){
  const s=mixSuma(box),el=box.querySelector(".mixCont"),falta=LATAS_CAJA-s;
  el.innerHTML=falta===0?pill({level:"ok",short:`${LATAS_CAJA} latas, completa`}):pill({level:"warn",short:falta>0?`Llevas ${s} de ${LATAS_CAJA} · faltan ${falta}`:`Llevas ${s} de ${LATAS_CAJA} · sobran ${-falta}`});
}
function readMixes(){
  return[...document.querySelectorAll("#mixes .mix")].flatMap(box=>{
    const n=Math.max(1,Math.round(Number(box.querySelector(".mixN").value)||1)),mx=box.dataset.mix;
    return[...box.querySelectorAll(".mixRows .line")].map(l=>{const[s,i]=l.querySelectorAll("select,input");const p=S.cfg.productos.find(x=>x.id===s.value),lat=Number(i.value)||0;
      return p&&lat>0?{prodId:p.id,nombre:p.nombre,formato:"caja",estilo:p.estilo||infoDeNombre(p.nombre).estilo,cant:n*lat/LATAS_CAJA,litrosU:p.litros,netoU:p.neto,mix:mx,mixCajas:n,latas:n*lat}:null}).filter(Boolean);
  });
}
/* texto de lo que se llevó en una venta; las cajas mixtas se muestran juntas */
function itemsTexto(items,marca,conLink=true){
  const est=e=>conLink?`<button class="lnkh" data-act="drill" data-k="${esc("estilo:"+marca+"|"+e)}">${esc(e)}</button>`:esc(e);
  const sueltos=(items||[]).filter(it=>!it.mix).map(it=>{const i=infoItem(it);return `${n1(it.cant)} × ${est(i.estilo)} <span class="muted">(${esc(FORMATOS[i.formato]||i.formato)})</span>`});
  const mixtas=[...new Set((items||[]).filter(it=>it.mix).map(it=>it.mix))].map(mx=>{const g=items.filter(it=>it.mix===mx),n=g[0].mixCajas||1;
    return `${n} ${n===1?"caja mixta":"cajas mixtas"} <span class="muted">(${g.map(it=>`${Math.round((it.latas||0)/n)} ${est(infoItem(it).estilo)}`).join(" + ")})</span>`});
  return[...sueltos,...mixtas].join(", ")||"—";
}
function addLine(it={prodId:"",cant:1}){
  const m=$("#sMarca").value;const ps=S.cfg.productos.filter(p=>p.marca===m);
  const d=document.createElement("div");d.className="line";

function readLines(){
  return [...document.querySelectorAll("#lines .line")].map(l=>{const[s,i]=l.querySelectorAll("select,input");const p=S.cfg.productos.find(x=>x.id===s.value);return p?{prodId:p.id,nombre:p.nombre,formato:p.formato||infoDeNombre(p.nombre).formato,estilo:p.estilo||infoDeNombre(p.nombre).estilo,cant:Number(i.value)||0,litrosU:p.litros,netoU:p.neto}:null}).filter(x=>x&&x.cant>0)
    .concat(document.querySelector("#mixes")?readMixes():[]);
}
function saleTotals(){
  if(!$("#sTot"))return;
  const it=readLines(),m=$("#sMarca").value;
  const litros=it.reduce((s,x)=>s+x.cant*x.litrosU,0), neto=it.reduce((s,x)=>s+x.cant*x.netoU,0), cajas=it.reduce((s,x)=>s+x.cant,0);
  const com=m==="cerveza"?litros*S.cfg.comL:neto*S.cfg.pctK/100;
  $("#sTot").innerHTML=`<span>${m==="cerveza"?n1(litros)+" L":n1(cajas)+" cajas ("+n1(litros)+" L)"}</span><span>Neto <b class="num">${money(neto)}</b></span><span>Con IVA <b class="num">${money(neto*1.19)}</b></span><span class="muted">Tu comisión bruta ≈ <b class="num">${money(com)}</b>${m==="kombucha"?" (al cobrar)":""}</span>`;
}

const PERMISOS=[

  ["editar_clientes","Crear y editar clientes",""],
  ["registrar_ventas","Registrar ventas",""],

  ["eliminar","Eliminar registros","Borrar clientes, ventas y visitas"],

  ["ver_barriles","Ver barriles","Dónde está cada barril, estilo, lote, factura y días en el cliente (útil para la gente de la cervecería)"],
  ["gestionar_barriles","Mover barriles","Crear barriles, marcar lavado, embarrilar, entregar y retirar"]
];
const SB=(window.CARTERA_CONFIG&&window.supabase&&!/PEGA_AQUI/.test(window.CARTERA_CONFIG.url))?window.supabase.createClient(window.CARTERA_CONFIG.url,window.CARTERA_CONFIG.anonKey):null;
const ME={user:null,perfil:null};
const isAdmin=()=>ME.perfil?.rol==="admin"&&ME.perfil?.activo;
const can=p=>isAdmin()||!!(ME.perfil?.activo&&ME.perfil?.permisos?.[p]);
const nombreDe=id=>S.equipo.find(x=>x.id===id)?.nombre||"";
const ownerOf=c=>c.asignado_a||c.creado_por;
const KEYCACHE=()=>"cartera-cache-"+(ME.user?.id||"");
/* Catálogo antiguo: un producto juntaba varios estilos ("Barril 30 L · Red / IPA").
   Se reemplaza por uno por estilo, conservando el precio que tenía cada grupo. */
const PROD_ANTIGUO={"b-pil":["b30-pil","b30-sol","b30-amb"],"b-ipa":["b30-red","b30-ipa"],"b-bip":["b30-bip"],"c-pil":["c24-pil","c24-sol"],"c-ipa":["c24-red","c24-ipa","c24-bip"],"k-17":["k24-ps","k24-tc","k24-gb"],"k-19":["k24-db","k24-el"]};
function infoDeNombre(nombre=""){
  return{formato:/barril/i.test(nombre)?"barril":/caja/i.test(nombre)?"caja":/lata/i.test(nombre)?"lata":"otro",
    estilo:nombre.includes(" · ")?nombre.split(" · ").pop():nombre};
}
function migrarProductos(ps){
  if(!ps)return null;
  if(ps.some(p=>p.formato))return ps;
  const nuevos=structuredClone(DEFAULT_CFG.productos),otros=[];
  ps.forEach(p=>{const ids=PROD_ANTIGUO[p.id];if(ids)nuevos.forEach(n=>{if(ids.includes(n.id))n.neto=p.neto});else otros.push({...p,...infoDeNombre(p.nombre)})});
  return[...nuevos,...otros];
}
function mergeCfg(d){
  const D=structuredClone(DEFAULT_CFG);d=d||{};
  return{...D,...structuredClone(d),frec:{...D.frec,...(d.frec||{})},plazo:{...D.plazo,...(d.plazo||{})},frecVisita:{...D.frecVisita,...(d.frecVisita||{})},
    zonas:d.zonas||D.zonas,zonasDia:{...D.zonasDia,...(d.zonasDia||{})},muestras:d.muestras||D.muestras,productos:migrarProductos(d.productos)||D.productos,
    prefs:{permitir:{...D.prefs.permitir,...(d.prefs?.permitir||{})},defecto:{...D.prefs.defecto,...(d.prefs?.defecto||{})}}};
}
const strip=o=>{const{id,clienteId,asignado_a,creado_por,actualizado,...rest}=o;return rest};
const fromCliente=r=>({...r.data,id:r.id,asignado_a:r.asignado_a,creado_por:r.creado_por});
const fromHijo=r=>({...r.data,id:r.id,clienteId:r.cliente_id,creado_por:r.creado_por});
const fromBarril=r=>({...r.data,id:r.id,codigo:r.codigo,creado_por:r.creado_por,actualizado:r.actualizado});
async function fetchAll(table){
  const out=[];let from=0;
  for(;;){const{data,error}=await SB.from(table).select("*").range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}
  return out;
}
async function loadAll(){
  let bErr=null;
  const[{data:perfil,error:pe},cl,ve,ac,{data:cfg},{data:eq},bs]=await Promise.all([
    SB.from("perfiles").select("*").eq("id",ME.user.id).maybeSingle(),
    fetchAll("clientes").catch(()=>[]),fetchAll("ventas").catch(()=>[]),fetchAll("actividades").catch(()=>[]),
    SB.from("config").select("data").eq("id",1).maybeSingle(),SB.rpc("equipo"),fetchAll("barriles").catch(e=>{bErr=e?.message||"error";return[]})]);
  if(pe)throw pe;
  ME.perfil=perfil;
  S.clientes=cl.map(fromCliente);S.ventas=ve.map(fromHijo);S.acts=ac.map(fromHijo);
  S.cfg=mergeCfg(cfg?.data);S.equipo=eq||[];S.barriles=bs.map(fromBarril);S.barrilErr=bErr;
  S.perfiles=isAdmin()?((await SB.from("perfiles").select("*").order("creado")).data||[]):[];
  S.offline=false;
  try{localStorage.setItem(KEYCACHE(),JSON.stringify({perfil,clientes:S.clientes,ventas:S.ventas,acts:S.acts,cfg:S.cfg,equipo:S.equipo,barriles:S.barriles,t:new Date().toISOString()}))}catch(e){}
}
function loadCache(){
  try{const d=JSON.parse(localStorage.getItem(KEYCACHE())||"null");if(!d)return false;
    ME.perfil=d.perfil;S.clientes=d.clientes;S.ventas=d.ventas;S.acts=d.acts;S.cfg=mergeCfg(d.cfg);S.equipo=d.equipo||[];S.barriles=d.barriles||[];S.cacheT=d.t;return true}catch(e){return false}
}
const TBL={clientes:"clientes",ventas:"ventas",actividades:"actividades",barriles:"barriles"};
const LOCAL={clientes:"clientes",ventas:"ventas",actividades:"acts",barriles:"barriles"};
function rowFor(col,data){
  if(col==="barriles"){const{id,creado_por,actualizado,...rest}=data;return{codigo:rest.codigo,data:rest}}
  if(col==="clientes"){const r={data:strip(data)};if("asignado_a" in data)r.asignado_a=data.asignado_a||null;return r}
  return{cliente_id:data.clienteId,data:strip(data)};
}
async function chk(p){const{error}=await p;if(error)throw error}
const DB={
  add:(col,data)=>chk(SB.from(TBL[col]).insert(rowFor(col,data))),
  set:(col,id,data)=>chk(SB.from(TBL[col]).update(rowFor(col,data)).eq("id",id)),
  update:(col,id,patch)=>{const cur=S[LOCAL[col]].find(x=>x.id===id);if(!cur)throw new Error("Registro no encontrado");return DB.set(col,id,{...cur,...patch})},
  delete:(col,id)=>chk(SB.from(TBL[col]).delete().eq("id",id)),
  setCfg:cfg=>chk(SB.from("config").update({data:cfg}).eq("id",1))
};
function errMsg(e){
  const m=e?.message||"";
  if(S.offline||/Failed to fetch|NetworkError|network/i.test(m))return"Sin conexión: no se guardó. Intenta cuando tengas señal.";
  if(e?.code==="42501"||/row-level security/i.test(m))return"No tienes permiso para hacer esto";
  if(e?.code==="P0001")return m;
  if(e?.code==="23505"&&/barril/i.test(m))return"Ese código de barril ya existe";
  return"No se pudo guardar: "+m;
}
function refresh(){
  const editing=(S.tab==="ajustes"&&document.activeElement?.closest?.("#cfgForm"))||(S.tab==="equipo"&&document.activeElement?.closest?.(".userCard"));
  if(!editing)render();
  if(S.openDetail&&$("#modal").innerHTML)clientDetail(S.openDetail);
  else if($("#modal .drill")){const sh=$("#modal .sheet"),sc=sh?.scrollTop||0;drillSheet(S.drillK);const s2=$("#modal .sheet");if(s2)s2.scrollTop=sc}
  else if(S.barrilAbierto&&$("#modal").innerHTML)barrilSheet(S.barrilAbierto);
}
async function guard(fn,okMsg){
  if(S.offline){toast("Sin conexión: por ahora solo puedes mirar");return false}
  try{await fn();if(okMsg)toast(okMsg);}
  catch(e){toast(errMsg(e));try{await loadAll()}catch(_){ }refresh();return false}
  try{await loadAll()}catch(e){}
  refresh();return true;
}
/* respaldo */
function descargar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportarRespaldo(){
  descargar(`cartera-respaldo-${today()}.json`,JSON.stringify({app:"cartera-valdivia",version:2,guardado:new Date().toISOString(),clientes:S.clientes,ventas:S.ventas,acts:S.acts,barriles:S.barriles,cfg:S.cfg},null,1),"application/json");
  toast("Respaldo descargado");
}
function csv(rows){return rows.map(r=>r.map(v=>{const t=String(v??"");return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}).join(";")).join("\n")}
function exportarCSV(){
  const cn=id=>S.clientes.find(c=>c.id===id)?.nombre||"";
  const ventas=[["Fecha","Cliente","Marca","Litros","Cajas","Neto","Total con IVA","Vence","Pagada","Fecha pago","Factura","Registró"],
    ...[...S.ventas].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).map(v=>[v.fecha,cn(v.clienteId),v.marca,v.litros,v.cajas,Math.round(v.neto),Math.round(v.neto*1.19),v.vence,v.pagado?"sí":"no",v.fechaPago,v.factura,nombreDe(v.creado_por)])];
  descargar(`ventas-${today()}.csv`,"﻿"+csv(ventas),"text/csv");
  const cl=[["Nombre","Estado","Importancia","Tipo","Zona","Marcas","Asignado a","Contacto","Teléfono","Dirección","Horario","Próxima acción","Qué hacer","Notas","Razón social","RUT empresa","Giro","Email","Dueño","RUT dueño","Teléfono dueño","Email dueño"],
    ...S.clientes.map(c=>[c.nombre,c.estado,impOf(c),c.tipo,c.zona,(c.marcas||[]).join(" + "),nombreDe(ownerOf(c)),c.contacto,c.telefono,c.direccion,c.horario,c.proxFecha,c.proxTexto,c.notas,c.razonSocial,c.rutEmpresa,c.giro,c.email,c.dueno,c.rutDueno,c.telDueno,c.emailDueno])];
  setTimeout(()=>descargar(`clientes-${today()}.csv`,"﻿"+csv(cl),"text/csv"),400);
  if(S.barriles.length){const br=[["Código","Litros","Estado","Estilo","Lote","Embarrilado","Cliente o destino","Factura","Desde","Días fuera","Notas"],
    ...[...S.barriles].sort(bOrden).map(b=>[b.codigo,litB(b),B_EST[b.estado]||b.estado,b.estilo,b.lote,b.fechaEmbarrilado,b.clienteNombre||b.destino,b.factura,b.fechaEntrega,enUso(b)&&b.fechaEntrega?days(b.fechaEntrega,today()):"",b.notas])];
    setTimeout(()=>descargar(`barriles-${today()}.csv`,"﻿"+csv(br),"text/csv"),800)}
}
async function importarRespaldo(file){
  if(!isAdmin()){toast("Solo el administrador puede cargar respaldos");return}
  let d;try{d=JSON.parse(await file.text());if(d.app!=="cartera-valdivia")throw 0}catch(e){toast("Ese archivo no es un respaldo de Cartera Valdivia");return}
  const ok=await guard(async()=>{
    const map={};
    for(const c of d.clientes||[]){const{data,error}=await SB.from("clientes").insert({data:strip(c),asignado_a:ME.user.id}).select("id").single();if(error)throw error;map[c.id]=data.id}
    const hijos=(arr,t)=>arr.filter(x=>map[x.clienteId]).map(x=>({cliente_id:map[x.clienteId],data:strip(x)}));
    const v=hijos(d.ventas||[]),a=hijos(d.acts||[]);
    for(let i=0;i<v.length;i+=500)await chk(SB.from("ventas").insert(v.slice(i,i+500)));
    for(let i=0;i<a.length;i+=500)await chk(SB.from("actividades").insert(a.slice(i,i+500)));
  },`Respaldo cargado: ${(d.clientes||[]).length} clientes, ${(d.ventas||[]).length} ventas`);
  if(ok)render();
}

async function afterLogin(){
  showApp(true);S.dbState="loading";render();
  try{await loadAll()}catch(e){
    if(loadCache()){S.offline=true}else{authScreen("login","No se pudo conectar. Revisa tu internet e intenta de nuevo.");return}
  }
  if(!ME.perfil||!ME.perfil.activo){authScreen("pendiente");return}
  const ef=aplicarPrefs();
  if(ef.idioma!==LANG&&prefsEf().idioma===ef.idioma){location.reload();return}
  S.dbState="on";S.rutaDe=ME.user.id;
  S.tab=visibleTabs().includes(ef.inicio)?ef.inicio:"resumen";
  render();
  bAbrirPendiente();
}
function visibleTabs(){
  const t=["resumen","tareas","ruta","clientes"];
  if(can("ver_cobranza")||can("registrar_ventas"))t.push("ventas");
  if(verBarriles())t.push("barriles");
  t.push("indices","ajustes");if(isAdmin())t.push("equipo");
  return t;
}
S.abrirBarril=codigoHash();
async function initCloud(){
  window.addEventListener("hashchange",()=>{if(codigoHash()&&ME.perfil?.activo&&S.dbState==="on")bAbrirPendiente()});
  if(!SB){authScreen();return}
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ME.user=session?.user||null;authScreen("nueva-clave");return}
    if(ev==="SIGNED_OUT"){ME.user=null;ME.perfil=null;authScreen()}
  });
  const{data}=await SB.auth.getSession();
  if(data?.session&&!location.hash.includes("type=recovery")){ME.user=data.session.user;afterLogin()}
  else if(!location.hash.includes("type=recovery"))authScreen();
  document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&ME.perfil?.activo&&!$("#modal").innerHTML){try{await loadAll();aplicarPrefs();refresh()}catch(e){}}});
  window.addEventListener("online",async()=>{if(ME.perfil?.activo){try{await loadAll();refresh();toast("Conexión recuperada")}catch(e){}}});
}

async function guardarUsuario(f){
  const id=f.dataset.uid;
  const permisos={};f.querySelectorAll("[data-perm]").forEach(x=>{if(x.checked&&!x.disabled)permisos[x.dataset.perm]=true});
  const rol=f.querySelector('[data-k="rol"]').value, activo=f.querySelector('[data-k="activo"]').checked;
  await guard(()=>chk(SB.from("perfiles").update({rol,activo,permisos}).eq("id",id)),"Permisos guardados");
}

    const ok=await guard(async()=>{
      if(aid)await DB.set("actividades",aid,data);else await DB.add("actividades",data);
      const cl=S.clientes.find(c=>c.id===cid);
      if(cl){const upd={};
        if(proxF){upd.proxFecha=proxF;upd.proxTexto=proxT||cl.proxTexto||""}
        else if(cl.proxFecha&&cl.proxFecha<=data.fecha&&PRESENCIAL.has(data.tipo)){upd.proxFecha="";upd.proxTexto=""}
        if(data.resultado==="No interesado"&&cl.estado==="prospecto")upd.estado="pausado";
        const mks=[...new Set(muestras.map(m=>m.marca))].filter(m=>!(cl.marcas||[]).includes(m));if(mks.length)upd.marcas=[...(cl.marcas||[]),...mks];
        if(Object.keys(upd).length)await DB.update("clientes",cid,upd)}
    },"Visita guardada");
    if(ok){if(S.openDetail===null&&S.tab!=="ruta")clientDetail(cid);else closeSheet()}
  }
  if(f.id==="saleForm"){
    const it=readLines();const cid=$("#sCli").value;const m=$("#sMarca").value;
    if(!cid){toast("Elige el cliente");return}
    if(!it.length){toast("Agrega al menos un producto con cantidad");return}
    const mala=[...document.querySelectorAll("#mixes .mix")].find(bx=>mixSuma(bx)!==LATAS_CAJA);
    if(mala){toast(`Cada caja mixta debe sumar ${LATAS_CAJA} latas (una lleva ${mixSuma(mala)})`);mala.scrollIntoView({block:"center"});return}
    const pag=$("#sPag").checked;const old=f.dataset.id?S.ventas.find(v=>v.id===f.dataset.id):null;
    const data={clienteId:cid,marca:m,fecha:$("#sFecha").value||today(),vence:$("#sVence").value||$("#sFecha").value,factura:$("#sFact").value.trim(),nota:$("#sNota").value.trim(),items:it,
      litros:Math.round(it.reduce((s,x)=>s+x.cant*x.litrosU,0)*100)/100,cajas:m==="kombucha"?it.reduce((s,x)=>s+x.cant,0):0,neto:it.reduce((s,x)=>s+x.cant*x.netoU,0),
      pagado:pag,fechaPago:pag?(old?.fechaPago||today()):""};
    const ok=await guard(async()=>{
      if(old)await DB.set("ventas",old.id,data);else await DB.add("ventas",data);
      const cl=S.clientes.find(c=>c.id===cid);
      if(cl){const upd={};if(cl.estado==="prospecto")upd.estado="activo";if(!(cl.marcas||[]).includes(m))upd.marcas=[...(cl.marcas||[]),m];if(Object.keys(upd).length)await DB.update("clientes",cid,upd)}
    },"Venta guardada");
    if(ok)closeSheet();
  }
  if(f.id==="cfgForm"){collectCfgForm();await guard(()=>DB.setCfg(structuredClone(S.cfg)),"Ajustes guardados");render()}
});

/* globo de los gráficos: aparece al pasar el mouse o al tocar/enfocar una barra */
const tipEl=document.createElement("div");tipEl.className="tip";tipEl.hidden=true;tipEl.setAttribute("role","status");document.body.appendChild(tipEl);
function tipShow(el,x,y){
  if(tipEl._el!==el){tipEl._el=el;tipEl.textContent=el.dataset.tip}
  tipEl.hidden=false;const r=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.max(8,Math.min(x+12,innerWidth-r.width-8))+"px";
  tipEl.style.top=(y-r.height-12<8?y+18:y-r.height-12)+"px";
}
function tipHide(){tipEl.hidden=true;tipEl._el=null}
document.addEventListener("mousemove",e=>{const el=e.target.closest?.("[data-tip]");el?tipShow(el,e.clientX,e.clientY):tipHide()});
const tipFoco=el=>{const r=el.getBoundingClientRect();tipShow(el,r.left+r.width/2,r.top)};
document.addEventListener("focusin",e=>{const el=e.target.closest?.("[data-tip]");el?tipFoco(el):tipHide()});
document.addEventListener("focusout",tipHide);
document.addEventListener("scroll",()=>{const el=tipEl._el;el&&el===document.activeElement?tipFoco(el):tipHide()},true);

function trTxt(s){
  if(Object.hasOwn(EN,s))return EN[s];
  for(const[rx,f]of EN_RX){const m=s.match(rx);if(m)return f(m)}
  for(const sep of[" · ",": "]){const i=s.indexOf(sep);
    if(i>0){const a=s.slice(0,i),b=s.slice(i+sep.length),ta=trTxt(a),tb=trTxt(b);if(ta!==null||tb!==null)return(ta??a)+sep+(tb??b)}}
  return null;
}
const NOTR="textarea,script,style,[data-notr]";
function trNodo(n){
  if(n.nodeType===3){
    const p=n.parentElement;if(!p||p.closest(NOTR))return;
    const v=n.nodeValue,s=v.trim();if(!s)return;
    const t=trTxt(s);if(t!==null&&t!==s)n.nodeValue=v.replace(s,()=>t);
    return;
  }
  if(n.nodeType!==1||n.closest("script,style,[data-notr]"))return;
  [n,...n.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(el=>{if(el.closest("[data-notr]"))return;
    ["placeholder","aria-label","title"].forEach(a=>{const v=el.getAttribute(a);if(v){const t=trTxt(v.trim());if(t!==null)el.setAttribute(a,t)}})});
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(trNodo);
}
if(LANG==="en"){trNodo(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNodo))).observe(document.body,{childList:true,subtree:true})}
