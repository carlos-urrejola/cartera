<title>Cartera Valdivia</title>
<script>
// Preferencias de este dispositivo: idioma, tema, tamaño de letra y pestaña de inicio.
// "cartera-prefs" = lo que eligió la persona; "cartera-ef" = lo último aplicado,
// que puede venir fijado por el administrador (ver aplicarPrefs).
const PREF_BASE={idioma:"es",tema:"oscuro",letra:"normal",inicio:"resumen"};
function prefsLocal(){
  let p={};try{p=JSON.parse(localStorage.getItem("cartera-prefs")||"{}")||{}}catch(e){}
  if(!p.tema){try{const t=localStorage.getItem("cartera-tema");if(t)p.tema=t}catch(e){}}
  return p;
}
function prefsEf(){try{return JSON.parse(localStorage.getItem("cartera-ef")||"null")||{}}catch(e){return{}}}
function letraAplicar(l){const r=document.documentElement;if(l==="grande"||l==="muygrande")r.setAttribute("data-letra",l);else r.removeAttribute("data-letra")}
function temaAplicar(t){
  const r=document.documentElement;
  if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t==="claro"?"light":"dark");
  const dark=t==="oscuro"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",dark?"#121814":"#18221D");
}
const BOOT={...PREF_BASE,...prefsLocal(),...prefsEf()};
const LANG=BOOT.idioma==="en"?"en":"es";
document.documentElement.lang=LANG;
temaAplicar(BOOT.tema);letraAplicar(BOOT.letra);
</script>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;

  --beer:#C9812C; --kom:#2AA088; --focus:#2AA088; --f1:#3987e5; --f2:#d95926; --f3:#199e70; --seq:#3987e5; --hmk:.8; --hm-hi:var(--ink);
  --ok:#6CCB86; --ok-soft:#1B3524; --warn:#E8C067; --warn-soft:#3A3016; --bad:#F08A76; --bad-soft:#3D1F1A; --none:#9AAAA1; --none-soft:#26302A;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121814; --surface:#1A221D; --surface-2:#243029; --ink:#E6EDE8; --muted:#9AAAA1; --line:#314038;
  --beer:#C9812C; --kom:#2AA088; --focus:#2AA088; --f1:#3987e5; --f2:#d95926; --f3:#199e70; --seq:#3987e5; --hmk:.8; --hm-hi:var(--ink);
  --ok:#6CCB86; --ok-soft:#1B3524; --warn:#E8C067; --warn-soft:#3A3016; --bad:#F08A76; --bad-soft:#3D1F1A; --none:#9AAAA1; --none-soft:#26302A;}

.line{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;align-items:center}

.btn.link.small{font-size:13px}

.sw-beer{background:var(--beer)} .sw-kom{background:var(--kom)} .sw-f1{background:var(--f1)} .sw-f2{background:var(--f2)} .sw-f3{background:var(--f3)} .sw-f0{background:var(--none)}
.hb{display:flex;flex-direction:column;gap:2px}

.hb-row:hover,.hb-row:focus-visible{background:var(--surface-2)}
.hb-lab{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cc-slot{flex:1;position:relative;display:flex;justify-content:center;align-items:flex-end;border-radius:4px}
.cc-slot:hover,.cc-slot:focus-visible{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}

.sw-ok{background:var(--ok)} .sw-warn{background:var(--warn)} .sw-bad{background:var(--bad)}
.hb-row.link{cursor:pointer}
.lnk{cursor:pointer;background:none}

.dsum .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
/* mapa de calor: un solo tono, de la superficie (poco) al azul (mucho); 2px de separación entre celdas */
table.hm{border-collapse:separate;border-spacing:0}
table.hm th.c,table.hm td.c{text-align:center;min-width:64px}
table.hm td.c{position:relative;border-bottom:0;padding:9px 6px;font-family:var(--mono);font-size:12px}

.hm-key{display:flex;align-items:center;gap:6px}

.tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:13px;pointer-events:none;max-width:280px;line-height:1.35}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<body>

<div class="app">
  <header class="top">
    <div><h1>Cartera Valdivia</h1><div class="muted small">Clientes de cerveza El Growler y kombucha Animal Social</div></div>
    <div class="row" id="hdr"></div>
  </header>
  <div id="status"></div>
  <main id="view"></main>
</div>
<button class="btn primary fab" data-act="chooser">+ Registrar</button>
<nav class="tabs" aria-label="Secciones">
  <button data-tab="resumen">Resumen</button>
  <button data-tab="ruta">Ruta</button>
  <button data-tab="clientes">Clientes</button>
  <button data-tab="ventas">Ventas</button>
  <button data-tab="indices">Índices</button>
  <button data-tab="ajustes">Ajustes</button>
  <button data-tab="equipo">Equipo</button>
</nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<div id="auth" hidden></div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
/* ---------- defaults (used until you save Ajustes) ---------- */
const DEFAULT_CFG = {
  comL:200, pctK:30, imm:553553, horas:30, desc:19, grat:true, ret:15.25, meta:800000,
  frec:{cerveza:14, kombucha:14},
  plazo:{cerveza:7, kombucha:0},
  tolPago:7,
  frecVisita:{A:7,B:14,C:30},
  zonas:["Centro","Isla Teja","Barrios Bajos","Las Ánimas","Collico","Regional","Niebla / Costa"],
  zonasDia:{"1":["Centro"],"2":["Isla Teja","Barrios Bajos"],"3":["Las Ánimas","Collico"],"4":["Centro","Regional"],"5":["Isla Teja","Niebla / Costa"],"6":[],"0":[]},
  // Un producto por estilo (formato + estilo), para poder ver las ventas por estilo en Índices
  productos:[

/* RUT chileno: dígito verificador (módulo 11) y formato 12.345.678-9 */
function rutDV(num){let s=0,m=2;for(let i=String(num).length-1;i>=0;i--){s+=Number(String(num)[i])*m;m=m===7?2:m+1}const r=11-(s%11);return r===11?"0":r===10?"K":String(r)}
function rutFormato(num){return String(num).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+rutDV(num)}
function rutLimpio(t){
  const s=String(t||"").toUpperCase().replace(/[^0-9K]/g,"");if(!s)return"";
  const num=s.slice(0,-1),dv=s.slice(-1);
  if(!/^\d{6,8}$/.test(num)||rutDV(num)!==dv)return null;
  return rutFormato(num);
}
/* GPS: acepta "lat, lng" o un link de Google Maps; undefined = texto no válido */
function parseGps(t){
  const s=String(t||"").trim();if(!s)return null;
  const m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m)return undefined;
  const lat=Number(m[1]),lng=Number(m[2]);
  return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat:Math.round(lat*1e6)/1e6,lng:Math.round(lng*1e6)/1e6}:undefined;
}
/* mapa del cliente: usa el punto GPS si lo tiene; si no, la dirección */
function mapsUrl(c,ir=false){
  if(c.gps)return ir?`https://www.google.com/maps/dir/?api=1&destination=${c.gps.lat},${c.gps.lng}`:`https://www.google.com/maps/search/?api=1&query=${c.gps.lat},${c.gps.lng}`;
  return c.direccion?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.direccion+", Valdivia")}`:"";
}
/* fotos: se achican en el teléfono antes de subirlas (máx. 1280 px, JPEG) y se guardan en Supabase Storage (privado) */
async function comprimirFoto(file,max=1280){
  const img=await createImageBitmap(file),k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.75));
}

function semCompra(c,marca){
  if(c.estado==="prospecto")return{level:"none",text:"Prospecto, aún sin compras",short:"Prospecto"};
  const vs=ventasDe(c.id).filter(v=>v.marca===marca);
  if(!vs.length)return{level:"none",text:"Sin compras registradas",short:"Sin compras"};
  const last=vs.map(v=>v.fecha).sort().pop();
  const d=days(last,today());
  const f=Number(c.frec?.[marca])||S.cfg.frec[marca]||14;
  return{level:d<=f?"ok":d<=f*1.5?"warn":"bad",text:`Última compra hace ${d} días (esperado cada ${f})`,short:d+" días",dias:d};
}
const semRecompra=c=>worst((c.marcas||[]).map(m=>semCompra(c,m)));
function deudaDe(cid){const t=today();return ventasDe(cid).filter(v=>!v.pagado).map(v=>({v,atraso:days(v.vence||v.fecha,t)}))}
function semPago(c){
  const ds=deudaDe(c.id);
  if(!ds.length)return{level:"ok",text:"Sin facturas pendientes",short:"Sin deuda"};
  const max=Math.max(...ds.map(d=>d.atraso));

  if(max>=0)return{level:"warn",text:max===0?`Vence hoy · ${money(monto)}`:`Vencida hace ${max} días · ${money(monto)}`,short:max===0?"Vence hoy":`Vencida ${max} d`};
  return{level:"ok",text:`${money(monto)} por cobrar, dentro de plazo`,short:"En plazo"};
}
function semSeg(c){
  if(!c.proxFecha)return{level:"none",text:"Sin próxima acción agendada",short:"Sin agendar"};
  const d=days(today(),c.proxFecha);
  if(d<0)return{level:"bad",text:`${c.proxTexto||"Seguimiento"} · atrasado ${-d} días`,short:`Atrasado ${-d} d`};
  if(d===0)return{level:"warn",text:`${c.proxTexto||"Seguimiento"} · hoy`,short:"Hoy"};
  return{level:"ok",text:`${c.proxTexto||"Seguimiento"} · ${fdate(c.proxFecha)}`,short:fdate(c.proxFecha)};
}

/* líquido del mes según litros de cerveza vendidos y neto de kombucha cobrado */
function liquido(litros,cobradoK){
  const c=S.cfg;
  const base=c.imm*c.horas/42, com=litros*c.comL;
  const grat=c.grat?Math.min(.25*(base+com),(4.75*c.imm/12)*(c.horas/42)):0;
  const liqB=(base+com+grat)*(1-c.desc/100);
  const comK=cobradoK*c.pctK/100, liqK=comK*(1-c.ret/100);
  return{base,com,grat,comK,liqB,liqK,total:liqB+liqK};
}
function resumenMes(mes,scope=S.scope){
  const inMes=f=>f&&f.slice(0,7)===mes;
  const mine=x=>scope!=="mias"||x.creado_por===ME.user?.id;
  const vc=S.ventas.filter(v=>v.marca==="cerveza"&&inMes(v.fecha)&&mine(v));
  const vk=S.ventas.filter(v=>v.marca==="kombucha"&&inMes(v.fecha)&&mine(v));
  const litros=vc.reduce((s,v)=>s+(v.litros||0),0);
  const netoC=vc.reduce((s,v)=>s+(v.neto||0),0);
  const cajasK=vk.reduce((s,v)=>s+(v.cajas||0),0);
  const netoK=vk.reduce((s,v)=>s+(v.neto||0),0);
  const cobradoK=S.ventas.filter(v=>v.marca==="kombucha"&&v.pagado&&inMes(v.fechaPago)&&mine(v)).reduce((s,v)=>s+(v.neto||0),0);
  const{com,comK,liqB,liqK}=liquido(litros,cobradoK);
  const am=S.acts.filter(a=>inMes(a.fecha)&&mine(a));
  const visitas=am.filter(a=>PRESENCIAL.has(a.tipo)).length;
  const activ=am.filter(a=>a.tipo==="Activación / degustación").length;
  const mu={};let muC=0,muK=0;
  am.forEach(a=>(a.muestras||[]).forEach(m=>{const k=m.marca+"|"+m.nombre+"|"+(m.unidad||"lata");mu[k]=(mu[k]||0)+m.cant;if(m.marca==="cerveza")muC+=m.cant;else muK+=m.cant}));
  return{litros,netoC,cajasK,netoK,cobradoK,com,comK,liqB,liqK,total:liqB+liqK,nC:vc.length,nK:vk.length,visitas,activ,mu,muC,muK};
}
/* conversión: clientes con activación o muestras en los últimos 60 días que después compraron */
function conversion(){
  const desde=addDays(today(),-60);
  const act=S.acts.filter(a=>a.fecha>=desde&&(a.tipo==="Activación / degustación"||(a.muestras||[]).length));
  const ids=[...new Set(act.map(a=>a.clienteId))];
  const conv=ids.filter(id=>{const first=act.filter(a=>a.clienteId===id).map(a=>a.fecha).sort()[0];return ventasDe(id).some(v=>v.fecha>=first)});
  return{total:ids.length,conv:conv.length};
}

/* ---------- ruta ---------- */
function planDia(fecha){
  const w=String(wday(fecha)), zonasHoy=S.cfg.zonasDia[w]||[];
  const isToday=fecha===today();
  const out=[];
  S.clientes.filter(c=>c.estado!=="pausado"&&(!S.rutaDe||(ownerOf(c)||ME.user?.id)===S.rutaDe)).forEach(c=>{
    const why=[];
    if(c.proxFecha===fecha)why.push({t:c.proxTexto?"Agendado: "+c.proxTexto:"Agendado",k:"agenda"});
    else if(isToday&&c.proxFecha&&c.proxFecha<fecha)why.push({t:"Atrasado: "+(c.proxTexto||"seguimiento"),k:"agenda"});
    if((c.diasVisita||[]).map(String).includes(w))why.push({t:"Día fijo de visita",k:"fijo"});
    const enZona=c.zona&&zonasHoy.includes(c.zona);
    if(enZona){
      const sv=semVisita(c);
      const diasAl=sv.dias===9999?9999:sv.dias+Math.max(0,days(today(),fecha));
      if(diasAl>=sv.f-2)why.push({t:sv.dias===9999?"Nunca visitado":"Toca visita ("+(diasAl)+" d)",k:"toca"});
      const sp=semPago(c);if(sp.level==="bad"||sp.level==="warn")why.push({t:"Cobrar: "+sp.short,k:"cobro"});
      const sr=semRecompra(c);if(sr.level==="bad")why.push({t:"Recompra atrasada",k:"recompra"});
    }
    if(!why.length)return;
    const done=actsDe(c.id).some(a=>a.fecha===fecha&&PRESENCIAL.has(a.tipo));
    const score=({A:30,B:20,C:10})[impOf(c)]+(why.some(x=>x.k==="agenda")?8:0)+(why.some(x=>x.k==="cobro")?5:0)+(why.some(x=>x.k==="recompra")?4:0)+(c.estado==="prospecto"?1:0);
    out.push({c,why,done,score,zona:c.zona||"Sin zona"});
  });
  return{zonasHoy,items:out.sort((a,b)=>b.score-a.score||a.c.nombre.localeCompare(b.c.nombre))};
}

/* ---------- índices (dashboards) ---------- */
S.ix={vista:"productos",periodo:"mes",marca:"todas",formato:"todos",quien:"todos",medida:"litros",modo:"juntos",zmodo:"mezcla"};
const MARCA_SW={cerveza:"beer",kombucha:"kom"};
const FMT_SW={barril:"f1",caja:"f2",lata:"f3",otro:"f0"};
function ixRango(p){
  const t=today(),m=t.slice(0,7);
  if(p==="mes")return[m+"-01",t];
  if(p==="mesAnt"){const a=shiftMes(m,-1);return[a+"-01",a+"-31"]}
  if(p==="3m")return[shiftMes(m,-2)+"-01",t];
  if(p==="anio")return[t.slice(0,4)+"-01-01",t];
  return["0000-01-01","9999-12-31"];
}
function infoItem(it){
  const p=S.cfg.productos.find(x=>x.id===it.prodId),g=infoDeNombre(it.nombre||p?.nombre||"");
  return{formato:it.formato||p?.formato||g.formato,estilo:it.estilo||p?.estilo||g.estilo};
}
/* una fila por producto vendido, con los filtros de Índices aplicados */
function ixLineas(){
  const x=S.ix,[d,h]=ixRango(x.periodo);
  const out=[];
  S.ventas.filter(v=>v.fecha>=d&&v.fecha<=h&&(x.marca==="todas"||v.marca===x.marca)&&(x.quien==="todos"||v.creado_por===x.quien)).forEach(v=>
    (v.items||[]).forEach(it=>{const i=infoItem(it);if(x.formato!=="todos"&&i.formato!==x.formato)return;
      const cl=S.clientes.find(c=>c.id===v.clienteId);
      out.push({marca:v.marca,...i,clienteId:v.clienteId,zona:cl?.zona||"Sin zona",unidades:it.cant||0,litros:(it.cant||0)*(it.litrosU||0),neto:(it.cant||0)*(it.netoU||0)})}));
  return out;
}
const ixFmt=(n,m)=>m==="neto"?money(n):m==="unidades"?n1(n)+" u.":m==="cuenta"?n1(n):n1(n)+" L";
/* barras horizontales apiladas: filas [{lab,segs:[{k,sw,v,nombre}]}] */
function hbars(filas,medida){
  const max=Math.max(...filas.map(f=>f.segs.reduce((s,x)=>s+x.v,0)),0)||1;
  return `<div class="hb">${filas.map(f=>{const tot=f.segs.reduce((s,x)=>s+x.v,0);const segs=f.segs.filter(x=>x.v>0);
    const tip=`${f.lab}: ${ixFmt(tot,medida)}${segs.length>1?" · "+segs.map(x=>`${x.nombre}: ${ixFmt(x.v,medida)}`).join(" · "):""}`;
    const link=f.act?` data-act="${f.act}" data-k="${esc(f.arg)}"`:f.id?` data-act="openClient" data-id="${f.id}"`:"";
    return `<div class="hb-row${link?" link":""}" tabindex="0" data-tip="${esc(tip)}"${link}><span class="hb-lab" title="${esc(f.lab)}">${esc(f.lab)}</span><span class="hb-track"><span class="hb-bar" style="width:${tot/max*82}%">${segs.map(x=>`<i class="sw-${x.sw}" style="flex:${x.v}"></i>`).join("")}</span><span class="hb-val">${ixFmt(tot,medida)}</span></span></div>`}).join("")}</div>`;
}

    <select data-ix="medida" aria-label="Medida">${opt("litros","Litros",x.medida)}${opt("unidades","Unidades",x.medida)}${plata?opt("neto","Neto $",x.medida):""}</select>

function ixProductos(){
  const x=S.ix,L=ixLineas(),m=x.medida,sum=(arr,k)=>arr.reduce((s,r)=>s+r[k],0);
  if(!L.length)return `<div class="card empty">No hay ventas con estos filtros.<span class="small">Prueba con otro período o registra una venta.</span></div>`;
  const porF=k=>L.filter(r=>r.formato===k);
  const tiles=`<section class="kpis">
    <div class="kpi"><span class="lab">Litros vendidos</span><span class="val">${n1(sum(L,"litros"))} L</span></div>
    ${Object.keys(FORMATOS).filter(k=>porF(k).length).map(k=>`<div class="kpi"><span class="lab"><i class="sw sw-${FMT_SW[k]}"></i>${FORMATOS[k]}</span><span class="val">${n1(sum(porF(k),"unidades"))}</span><span class="muted small">${n1(sum(porF(k),"litros"))} L</span></div>`).join("")}
    ${can("ver_cobranza")?`<div class="kpi"><span class="lab">Neto vendido</span><span class="val">${money(sum(L,"neto"))}</span></div>`:""}
  </section>`;
  const marcas=[...new Set(L.map(r=>r.marca))];
  const fmtFilas=Object.keys(FORMATOS).filter(k=>porF(k).length).map(k=>({lab:FORMATOS[k],segs:["cerveza","kombucha"].map(mk=>({k:mk,sw:MARCA_SW[mk],nombre:mk==="cerveza"?"Cerveza":"Kombucha",v:sum(porF(k).filter(r=>r.marca===mk),m)}))}));
  const estilos=[...new Set(L.map(r=>r.marca+"|"+r.estilo))];
  const estFilas=estilos.map(ke=>{const[mk,e]=ke.split("|"),rs=L.filter(r=>r.marca===mk&&r.estilo===e);

    .sort((a,b)=>b.segs.reduce((s,y)=>s+y.v,0)-a.segs.reduce((s,y)=>s+y.v,0));

/* zonas: mapa de calor zona × estilo, por marca, y qué ofrecer en cada zona */
const sumM=(arr,m)=>arr.reduce((s,r)=>s+r[m],0);
const pctTxt=v=>Math.round(v*100)+"%";
function heatmap(marca,L,m,modo){
  const rs=L.filter(r=>r.marca===marca);if(!rs.length)return"";
  const total=sumM(rs,m)||1;
  const estilos=[...new Set(rs.map(r=>r.estilo))].map(e=>[e,sumM(rs.filter(r=>r.estilo===e),m)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const shG=Object.fromEntries(estilos.map(e=>[e,sumM(rs.filter(r=>r.estilo===e),m)/total]));
  const orden=[...S.cfg.zonas,"Sin zona"],pos=z=>{const i=orden.indexOf(z);return i<0?99:i};
  const zonas=[...new Set(rs.map(r=>r.zona))].sort((a,b)=>pos(a)-pos(b));
  const totZ=Object.fromEntries(zonas.map(z=>[z,sumM(rs.filter(r=>r.zona===z),m)]));
  const val=(z,e)=>sumM(rs.filter(r=>r.zona===z&&r.estilo===e),m);
  const esc2=(z,e)=>{const v=val(z,e);return{v,sh:totZ[z]?v/totZ[z]:0}};
  let max=0;zonas.forEach(z=>estilos.forEach(e=>{const c=esc2(z,e);max=Math.max(max,modo==="mezcla"?c.sh:c.v)}));max=max||1;
  const corto=v=>m==="neto"?moneyK(v):n1(v);
  const tabla=`<div class="tbox"><table class="hm"><thead><tr><th>Zona</th>${estilos.map(e=>`<th class="c"><button class="lnkh" data-act="drill" data-k="${esc("estilo:"+marca+"|"+e)}">${esc(e)}</button></th>`).join("")}<th class="r">Total</th></tr></thead><tbody>
    ${zonas.map(z=>`<tr><td>${z==="Sin zona"?esc(z):`<button class="lnkh" data-act="drill" data-k="${esc("zona:"+z)}">${esc(z)}</button>`}</td>${estilos.map(e=>{const c=esc2(z,e),p=(modo==="mezcla"?c.sh:c.v)/max;
      return `<td class="c${p>=.78?" hi":""}" style="--p:${p.toFixed(3)};cursor:pointer" tabindex="0" data-act="drill" data-k="${esc("estilo:"+marca+"|"+e)}" data-tip="${esc(`${z} · ${e}: ${pctTxt(c.sh)} · ${ixFmt(c.v,m)}`)}"><span>${c.v?(modo==="mezcla"?pctTxt(c.sh):corto(c.v)):"–"}</span></td>`}).join("")}<td class="r num">${ixFmt(totZ[z],m)}</td></tr>`).join("")}
  </tbody></table></div>`;
  // lectura: lo que más sale en cada zona y qué estilos conviene ofrecer
  const tops=Object.fromEntries(zonas.map(z=>[z,estilos.map(e=>[e,esc2(z,e).sh]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0)]));
  const favoritos={};zonas.forEach(z=>{const t=tops[z][0];if(t)favoritos[t[0]]=(favoritos[t[0]]||0)+1});
  const [fav,nFav]=Object.entries(favoritos).sort((a,b)=>b[1]-a[1])[0]||[];
  const ofrecer=z=>estilos.filter(e=>shG[e]>=.1&&esc2(z,e).sh<shG[e]/3).slice(0,3);
  const sinVentas=S.cfg.zonas.filter(z=>!zonas.includes(z));
  const lectura=`<div class="stack" style="gap:8px">
    ${zonas.length>1&&fav?`<div class="small"><b>${esc(fav)}</b> es lo más vendido en ${nFav} de ${zonas.length} zonas.</div>`:""}
    <div class="zgridcards">${zonas.map(z=>{const o=ofrecer(z);return `<div class="zcard">${z==="Sin zona"?`<b>${esc(z)}</b>`:`<button class="lnkh" style="font-weight:700;text-align:left" data-act="drill" data-k="${esc("zona:"+z)}">${esc(z)} ›</button>`}
      <div class="small">Lo que más sale: ${tops[z].slice(0,2).map(([e,s])=>`${esc(e)} (${pctTxt(s)})`).join(", ")}</div>
      ${o.length?`<div class="small">Para ofrecer: <b>${o.map(esc).join(", ")}</b></div>`:""}</div>`}).join("")}</div>
    ${sinVentas.length?`<div class="small muted">Zonas sin ventas en este período: ${sinVentas.map(esc).join(", ")}. Buena oportunidad para llevar ${estilos.slice(0,2).map(esc).join(" y ")}.</div>`:""}
    <div class="muted small">"Para ofrecer" son estilos que se venden bien en general pero poco o nada en esa zona.</div>
  </div>`;
  return `<section class="card stack"><div class="row spread"><div><h3><span class="row" style="gap:6px"><i class="sw ${MARCA_SW[marca]}"></i>${marca==="cerveza"?"Cerveza por zona":"Kombucha por zona"}</span></h3>
    <div class="muted small">${modo==="mezcla"?"% de lo vendido en cada zona":"Cantidad vendida"} · ${m==="neto"?"neto":m==="unidades"?"unidades":"litros"}</div></div>
    <div class="hm-key small muted"><span>Menos</span><i></i><span>Más</span></div></div>
    ${tabla}${lectura}</section>`;
}
function ixZonas(){
  const x=S.ix,L=ixLineas();

/* cobranza: deuda por antigüedad y morosos */
function ixCobranza(){
  const t=today(),tol=S.cfg.tolPago;
  const pend=S.ventas.filter(v=>!v.pagado).map(v=>({v,atr:days(v.vence||v.fecha,t),monto:(v.neto||0)*1.19}));
  const porCobrar=pend.reduce((s,p)=>s+p.monto,0),venc=pend.filter(p=>p.atr>0),vencido=venc.reduce((s,p)=>s+p.monto,0);
  const pagadas=S.ventas.filter(v=>v.pagado&&v.fechaPago&&v.fechaPago>=addDays(t,-90));
  const diasPago=pagadas.length?pagadas.reduce((s,v)=>s+Math.max(0,days(v.fecha,v.fechaPago)),0)/pagadas.length:null;
  const tramos=[["ok","✓ Por vencer",p=>p.atr<0],["warn",`! Vence hoy o hasta ${tol} días de atraso`,p=>p.atr>=0&&p.atr<=tol],["bad",`✕ ${tol+1} a 30 días de atraso`,p=>p.atr>tol&&p.atr<=30],["bad","✕ Más de 30 días de atraso",p=>p.atr>30]];
  const filas=tramos.map(([sw,lab,f])=>{const ps=pend.filter(f);return{lab,segs:[{k:sw,sw,nombre:lab,v:ps.reduce((s,p)=>s+p.monto,0)}],n:ps.length}});
  const morosos=[...new Set(venc.map(p=>p.v.clienteId))].map(id=>{const ps=venc.filter(p=>p.v.clienteId===id),cl=S.clientes.find(c=>c.id===id);
    return{id,cl,monto:ps.reduce((s,p)=>s+p.monto,0),n:ps.length,max:Math.max(...ps.map(p=>p.atr))}}).sort((a,b)=>b.monto-a.monto);
  if(!pend.length&&!pagadas.length)return `<div class="card empty">No hay facturas por cobrar ni pagos recientes.</div>`;
  return `<section class="kpis">
    <div class="kpi"><span class="lab">Por cobrar (con IVA)</span><span class="val">${money(porCobrar)}</span><span class="muted small">${pend.length} facturas</span></div>
    <div class="kpi"><span class="lab">Vencido</span><span class="val">${money(vencido)}</span><span class="muted small">${porCobrar?pctTxt(vencido/porCobrar):"0%"} de lo por cobrar</span></div>
    <div class="kpi"><span class="lab">Días promedio de pago</span><span class="val">${diasPago===null?"—":n1(diasPago)}</span><span class="muted small">pagos de los últimos 90 días</span></div>
    <div class="kpi"><span class="lab">Clientes con deuda vencida</span><span class="val">${morosos.length}</span></div>
  </section>
  ${pend.length?`<section class="card stack"><div><h3>Deuda por antigüedad</h3><div class="muted small">Monto con IVA de las facturas pendientes</div></div>${hbars(filas.filter(f=>f.n),"neto")}</section>`:""}
  ${morosos.length?`<section class="card stack"><div><h3>Morosos</h3><div class="muted small">Clientes con facturas vencidas, de mayor a menor deuda</div></div>
    <div class="tbox"><table><thead><tr><th>Cliente</th><th class="r">Vencido</th><th class="r">Facturas</th><th>Atraso</th></tr></thead><tbody>
    ${morosos.map(r=>`<tr><td>${r.cl?`<button class="btn link" style="font-size:14px" data-act="openClient" data-id="${r.id}">${esc(r.cl.nombre)}</button>`:"(cliente borrado)"}</td><td class="r num">${money(r.monto)}</td><td class="r num">${r.n}</td><td>${pill({level:r.max>tol?"bad":"warn",short:`Vencida ${r.max} d`})}</td></tr>`).join("")}
    </tbody></table></div></section>`:`<div class="card empty">Nadie tiene facturas vencidas. 👌</div>`}`;
}

/* compacto para ejes: $850k, $1,2M */
const moneyK=n=>n>=1e6?"$"+(Math.round(n/1e5)/10).toLocaleString("es-CL")+"M":n>=1e3?"$"+Math.round(n/1e3)+"k":"$"+Math.round(n);
function pasoLindo(v){const p=10**Math.floor(Math.log10(v||1));return[1,2,2.5,5,10].map(k=>k*p).find(s=>s>=v)}
function ixSueldo(){
  const c=S.cfg,mes=today().slice(0,7);

  let desde=mias[0]&&mias[0]<mes?mias[0]:mes;if(desde<shiftMes(mes,-11))desde=shiftMes(mes,-11);
  const meses=[];for(let m=desde;m<=mes;m=shiftMes(m,1))meses.push(m);
  const R=meses.map(m=>({m,...resumenMes(m,"mias")}));
  const hoy=R[R.length-1];
  const [y,mm]=mes.split("-").map(Number),diasMes=new Date(y,mm,0).getDate(),dia=Number(today().slice(8));

  const falta=Math.max(0,c.meta-hoy.total);
  let lit=null;if(falta>0&&c.comL>0){let lo=0,hi=1e5;if(liquido(hoy.litros+hi,hoy.cobradoK).total>=c.meta){for(let i=0;i<40;i++){const mid=(lo+hi)/2;liquido(hoy.litros+mid,hoy.cobradoK).total>=c.meta?hi=mid:lo=mid}lit=Math.ceil(hi)}}
  const kob=falta>0&&c.pctK>0?falta/((c.pctK/100)*(1-c.ret/100)):0;

  return `<section class="card hero" aria-label="Meta del mes">

    <div class="stack" style="gap:8px">
      <div class="meter" role="img" aria-label="${Math.round(Math.min(1,hoy.total/c.meta)*100)}% de la meta"><span class="b" style="width:${Math.min(100,hoy.liqB/Math.max(c.meta,hoy.total)*100)}%"></span><span class="k" style="width:${Math.min(100,hoy.liqK/Math.max(c.meta,hoy.total)*100)}%"></span></div>
      <div class="legend"><span><i class="sw beer"></i>El Growler <b class="num">${money(hoy.liqB)}</b></span><span><i class="sw kom"></i>Kombucha <b class="num">${money(hoy.liqK)}</b></span></div>
      <div class="muted small">Solo tus ventas. Kombucha cuenta lo cobrado en el mes.</div>
    </div></section>
  <section class="kpis">
    <div class="kpi"><span class="lab">Proyección fin de mes</span><span class="val">${money(proy)}</span><span class="muted small">A este ritmo (día ${dia} de ${diasMes})</span></div>
    <div class="kpi"><span class="lab">Te falta</span><span class="val">${ok?"✓ Nada":money(falta)}</span><span class="muted small">${ok?"Meta cumplida":"líquido para la meta"}</span></div>
    ${!ok&&lit!==null?`<div class="kpi"><span class="lab">Cerveza que falta</span><span class="val">${n1(lit)} L</span><span class="muted small">≈ ${barrilesF} barriles de 30 L</span></div>`:""}
    ${!ok&&kob>0?`<div class="kpi"><span class="lab">O kombucha por cobrar</span><span class="val">${money(kob)}</span><span class="muted small">neto cobrado</span></div>`:""}
  </section>
  <section class="card stack"><div><h3>Sueldo líquido por mes</h3><div class="muted small">Estimado con tus ventas de cada mes, contra la meta de ${money(c.meta)}</div></div>
    <div class="legend"><span><i class="sw beer"></i>El Growler</span><span><i class="sw kom"></i>Kombucha</span><span><i class="cc-key"></i>Meta</span></div>

  <details class="card"><summary>Ver tabla</summary><div class="tbox" style="margin-top:10px"><table><thead><tr><th>Mes</th><th class="r">Litros</th><th class="r">El Growler</th><th class="r">Kombucha</th><th class="r">Total</th><th class="r">% meta</th></tr></thead><tbody>

const dMes=f=>f&&f.slice(0,7)===S.mes;
const btnVolver=()=>S.pila?.length?`<button class="btn sm" data-act="volver">‹ Volver</button>`:"";
const dHdr=(t,sub)=>`<div class="row spread" style="flex-wrap:nowrap;align-items:flex-start"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${btnVolver()}<div><h2>${t}</h2>${sub?`<div class="muted small">${sub}</div>`:""}</div></div><button class="btn sm" data-act="close">Cerrar</button></div>`;
/* navegación conectada: cada ficha (cliente, zona, estilo o cuadro) recuerda de dónde vino */
S.pila=[];
function navPush(){
  if(!$("#modal").innerHTML){S.pila=[];return}
  if($("#modal .drill"))S.pila.push({t:"drill",k:S.drillK});
  else if(S.openDetail)S.pila.push({t:"cli",id:S.openDetail});
}
function navVolver(){const p=S.pila.pop();if(!p)return closeSheet();p.t==="drill"?drillSheet(p.k):clientDetail(p.id)}
const lnkZona=z=>z&&z!=="Sin zona"?`<button class="chip strong lnk" data-act="drill" data-k="${esc("zona:"+z)}">${esc(z)} ›</button>`:"";
const hace6m=()=>shiftMes(today().slice(0,7),-5)+"-01";
function lineasDesde(desde,filtro=()=>true){
  return S.ventas.filter(v=>(v.fecha||"")>=desde&&filtro(v)).flatMap(v=>(v.items||[]).map(it=>{const cl=S.clientes.find(c=>c.id===v.clienteId);
    return{marca:v.marca,...infoItem(it),clienteId:v.clienteId,zona:cl?.zona||"Sin zona",mes:(v.fecha||"").slice(0,7),unidades:it.cant||0,litros:(it.cant||0)*(it.litrosU||0),neto:(it.cant||0)*(it.netoU||0)}}));
}
function dZona(z){
  const cs=S.clientes.filter(c=>(c.zona||"Sin zona")===z).sort((a,b)=>impOf(a).localeCompare(impOf(b))||a.nombre.localeCompare(b.nombre));
  const L=lineasDesde(hace6m(),v=>cs.some(c=>c.id===v.clienteId));
  const est=[...new Set(L.map(r=>r.marca+"|"+r.estilo))].map(k=>{const[mk,e]=k.split("|");return{lab:e,act:"drill",arg:"estilo:"+k,segs:[{k:mk,sw:MARCA_SW[mk],nombre:mk,v:sumM(L.filter(r=>r.marca===mk&&r.estilo===e),"litros")}]}}).sort((a,b)=>b.segs[0].v-a.segs[0].v);
  const deuda=S.ventas.filter(v=>!v.pagado&&cs.some(c=>c.id===v.clienteId)).reduce((s,v)=>s+(v.neto||0)*1.19,0);
  const dias=Object.entries(S.cfg.zonasDia).filter(([,zs])=>zs.includes(z)).map(([d])=>DIAS_L[d]);
  return dHdr("Zona "+z,`${cs.length} clientes${dias.length?" · se visita el "+dias.join(", "):""}`)+
   `<section class="kpis"><div class="kpi"><span class="lab">Litros 6 meses</span><span class="val">${n1(sumM(L,"litros"))} L</span></div>
    ${can("ver_cobranza")?`<div class="kpi"><span class="lab">Por cobrar (con IVA)</span><span class="val">${money(deuda)}</span></div>`:""}
    <div class="kpi"><span class="lab">Activos</span><span class="val">${cs.filter(c=>c.estado==="activo").length}</span><span class="muted small">${cs.filter(c=>c.estado==="prospecto").length} prospectos</span></div></section>
   ${est.length?`<section class="card stack"><div><h3>Lo que se vende aquí</h3><div class="muted small">Litros de los últimos 6 meses · toca un estilo para ver quién lo compra</div></div>${hbars(est,"litros")}</section>`:""}
   <section class="card"><h3 style="margin-bottom:4px">Clientes de la zona</h3>${cs.length?cs.map(c=>dFila(c.id,[c.tipo,ESTADOS[c.estado],ultimaCompra(c.id)].filter(Boolean).map(esc).join(" · "),pill(worst([semPago(c),semRecompra(c),semSeg(c),semVisita(c)])))).join(""):`<div class="muted small">Sin clientes.</div>`}</section>`;
}
function dEstilo(mk,e){
  const L=lineasDesde(hace6m(),v=>v.marca===mk).filter(r=>r.estilo===e);
  const ids=[...new Set(L.map(r=>r.clienteId))];
  const porCli=ids.map(id=>({lab:cliNom(id),id:S.clientes.some(c=>c.id===id)?id:null,segs:[{k:mk,sw:MARCA_SW[mk],nombre:mk,v:sumM(L.filter(r=>r.clienteId===id),"litros")}]})).sort((a,b)=>b.segs[0].v-a.segs[0].v);
  const porZona=[...new Set(L.map(r=>r.zona))].map(z=>({lab:z,act:z!=="Sin zona"?"drill":null,arg:"zona:"+z,segs:[{k:mk,sw:MARCA_SW[mk],nombre:mk,v:sumM(L.filter(r=>r.zona===z),"litros")}]})).sort((a,b)=>b.segs[0].v-a.segs[0].v);
  const meses=[];for(let i=5;i>=0;i--)meses.push(shiftMes(today().slice(0,7),-i));
  const porMes=meses.map(m=>({lab:mesLabel(m),segs:[{k:mk,sw:MARCA_SW[mk],nombre:mk,v:sumM(L.filter(r=>r.mes===m),"litros")}]}));
  const candidatos=S.clientes.filter(c=>c.estado!=="pausado"&&(c.marcas||[]).includes(mk)&&!ventasDe(c.id).some(v=>(v.items||[]).some(it=>infoItem(it).estilo===e)));
  return dHdr(e,`${mk==="cerveza"?"Cerveza":"Kombucha"} · últimos 6 meses`)+
   `<section class="kpis"><div class="kpi"><span class="lab">Litros</span><span class="val">${n1(sumM(L,"litros"))} L</span></div><div class="kpi"><span class="lab">Clientes que lo compran</span><span class="val">${ids.length}</span></div></section>
   ${porCli.length?`<section class="card stack"><h3>Quién lo compra</h3>${hbars(porCli,"litros")}</section><section class="card stack"><h3>En qué zonas</h3>${hbars(porZona,"litros")}</section><section class="card stack"><h3>Mes a mes</h3>${hbars(porMes,"litros")}</section>`:`<div class="empty">Nadie lo ha comprado en los últimos 6 meses.</div>`}
   ${candidatos.length?`<section class="card"><div style="margin-bottom:4px"><h3>Para ofrecérselo</h3><div class="muted small">Clientes de ${mk} que nunca lo han comprado</div></div>${candidatos.map(c=>dFila(c.id,[c.zona,c.tipo,ultimaCompra(c.id)].filter(Boolean).map(esc).join(" · "))).join("")}</section>`:""}`;
}
const cliNom=id=>S.clientes.find(c=>c.id===id)?.nombre||"(cliente borrado)";
function dFila(id,sub,der=""){
  const c=S.clientes.find(x=>x.id===id);
  return `<button class="drow"${c?` data-act="openClient" data-id="${id}"`:""}>${c?impBadge(c):"<span></span>"}<span><b style="font-weight:600">${esc(c?c.nombre:"(cliente borrado)")}</b>${sub?`<div class="sub">${sub}</div>`:""}</span><span>${der}</span></button>`;
}
function ultimaCompra(id){const f=ventasDe(id).map(v=>v.fecha).filter(Boolean).sort().pop();return f?`Última compra hace ${days(f,today())} días`:"Sin compras"}
function dVentasMarca(marca){
  const vs=S.ventas.filter(v=>v.marca===marca&&dMes(v.fecha)&&dMine(v)).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const m=marca==="cerveza"?"litros":"unidades",sw=MARCA_SW[marca],plata=can("ver_cobranza");
  if(!vs.length)return `<div class="empty">No hay ventas de ${marca} en ${mesLabel(S.mes)}.</div>`;
  const L=vs.flatMap(v=>(v.items||[]).map(it=>({...infoItem(it),clienteId:v.clienteId,unidades:it.cant||0,litros:(it.cant||0)*(it.litrosU||0)})));
  const agrupa=(key,lab,id)=>[...new Set(L.map(key))].map(k=>({lab:lab(k),id:id?id(k):null,segs:[{k:marca,sw,nombre:marca,v:sumM(L.filter(r=>key(r)===k),m)}]})).sort((a,b)=>b.segs[0].v-a.segs[0].v);
  const est=agrupa(r=>r.estilo+"|"+r.formato,k=>{const[e,f]=k.split("|");return `${e} · ${FORMATOS[f]||f}`}).map(x=>({...x,act:"drill",arg:"estilo:"+marca+"|"+x.lab.split(" · ")[0]}));
  const cli=agrupa(r=>r.clienteId,k=>cliNom(k),k=>S.clientes.some(c=>c.id===k)?k:null);
  return `<section class="card stack"><h3>Por producto</h3>${hbars(est,m)}</section>
    <section class="card stack"><div><h3>Por cliente</h3><div class="muted small">Toca uno para ver su ficha</div></div>${hbars(cli,m)}</section>
    <section class="card"><h3 style="margin-bottom:4px">Ventas (${vs.length})</h3>${vs.map(v=>dFila(v.clienteId,`${fdate(v.fecha)} · ${(v.items||[]).map(it=>`${n1(it.cant)} × ${esc(infoItem(it).estilo)}`).join(", ")}`,`<span class="num small">${marca==="cerveza"?n1(v.litros)+" L":n1(v.cajas)+" cajas"}${plata?`<br>${money(v.neto)}`:""}</span>`)).join("")}</section>`;
}
function drillSheet(k){
  S.drillK=k;const c=S.cfg,mes=mesLabel(S.mes);let h="";
  if(k.startsWith("zona:"))h=dZona(k.slice(5));
  else if(k.startsWith("estilo:")){const[mk,e]=k.slice(7).split("|");h=dEstilo(mk,e)}
  else if(k==="liquido"){
    const r=resumenMes(S.mes),L=liquido(r.litros,r.cobradoK),bruto=L.base+L.com+L.grat;
    const fila=(t,v,cls="")=>`<span class="${cls}">${t}</span><span class="num ${cls}" style="text-align:right">${v}</span>`;
    const topC=[...new Set(S.ventas.filter(v=>v.marca==="cerveza"&&dMes(v.fecha)&&dMine(v)).map(v=>v.clienteId))].map(id=>({lab:cliNom(id),id:S.clientes.some(x=>x.id===id)?id:null,segs:[{k:"c",sw:"beer",nombre:"Cerveza",v:S.ventas.filter(v=>v.clienteId===id&&v.marca==="cerveza"&&dMes(v.fecha)&&dMine(v)).reduce((s,v)=>s+(v.litros||0),0)*c.comL}]})).sort((a,b)=>b.segs[0].v-a.segs[0].v).slice(0,8);
    h=dHdr("Desglose del sueldo",mes)+`<section class="card"><div class="dsum">
      ${fila(`Sueldo base (${c.horas} de 42 h)`,money(L.base))}${fila(`Comisión cerveza (${n1(r.litros)} L × ${money(c.comL)})`,money(L.com))}
      ${c.grat?fila("Gratificación legal",money(L.grat)):""}${fila(`Descuentos legales (${c.desc}%)`,"−"+money(bruto*c.desc/100))}
      ${fila("Líquido El Growler",money(L.liqB),"tot")}
      ${fila("Kombucha cobrada en el mes (neto)",money(r.cobradoK))}${fila(`Comisión kombucha (${c.pctK}%)`,money(L.comK))}${fila(`Retención boleta (${c.ret}%)`,"−"+money(L.comK*c.ret/100))}
      ${fila("Líquido kombucha",money(L.liqK),"tot")}
      ${fila("Total estimado",money(L.total),"tot")}${fila("Meta",money(c.meta))}${fila(L.total>=c.meta?"Sobre la meta":"Falta para la meta",money(Math.abs(c.meta-L.total)))}
    </div></section>
    ${topC.length?`<section class="card stack"><div><h3>Quién aporta tu comisión de cerveza</h3><div class="muted small">Comisión bruta por cliente este mes</div></div>${hbars(topC,"neto")}</section>`:""}
    <button class="btn" data-act="goIx" data-v="sueldo">Ver Índices › Sueldo y meta</button>`;
  }
  else if(k==="cerveza")h=dHdr("Cerveza vendida",mes)+dVentasMarca("cerveza");
  else if(k==="kombucha")h=dHdr("Kombucha vendida",mes)+dVentasMarca("kombucha");
  else if(k==="cobrar"){
    const t=today(),pend=S.ventas.filter(v=>!v.pagado);
    const ids=[...new Set(pend.map(v=>v.clienteId))].map(id=>{const ps=pend.filter(v=>v.clienteId===id);return{id,monto:ps.reduce((s,v)=>s+(v.neto||0)*1.19,0),n:ps.length,max:Math.max(...ps.map(v=>days(v.vence||v.fecha,t)))}}).sort((a,b)=>b.max-a.max||b.monto-a.monto);
    const tot=ids.reduce((s,x)=>s+x.monto,0);
    h=dHdr("Por cobrar",`${money(tot)} con IVA · ${pend.length} facturas`)+(ids.length?`<section class="card">${ids.map(x=>{const s=x.max>c.tolPago?{level:"bad",short:`Vencida ${x.max} d`}:x.max>=0?{level:"warn",short:x.max===0?"Vence hoy":`Vencida ${x.max} d`}:{level:"ok",short:"En plazo"};
      return dFila(x.id,`${x.n} ${x.n===1?"factura":"facturas"}`,`<span class="num small">${money(x.monto)}</span><br>${pill(s)}`)}).join("")}</section>
      <button class="btn" data-act="goIx" data-v="cobranza">Ver Índices › Cobranza</button>`:`<div class="empty">No hay facturas por cobrar.</div>`);
  }
  else if(k==="clientes"){
    const st=S.drillSub,cs=S.clientes.filter(x=>x.estado===st).sort((a,b)=>impOf(a).localeCompare(impOf(b))||a.nombre.localeCompare(b.nombre));
    const n=e=>S.clientes.filter(x=>x.estado===e).length;
    h=dHdr("Clientes")+`<div class="seg" role="group" aria-label="Estado">${Object.entries(ESTADOS).map(([e,l])=>`<button data-act="drillSub" data-v="${e}" aria-pressed="${st===e}">${l} (${n(e)})</button>`).join("")}</div>
      ${cs.length?`<section class="card">${cs.map(x=>dFila(x.id,[x.zona,x.tipo,ultimaCompra(x.id)].filter(Boolean).map(esc).join(" · "),pill(worst([semPago(x),semRecompra(x),semSeg(x),semVisita(x)])))).join("")}</section>`:`<div class="empty">No hay clientes en este estado.</div>`}`;
  }
  else if(k==="ruta"){
    const p=planDia(today()),pend=p.items.filter(i=>!i.done);
    h=dHdr(`Ruta de hoy`,`${DIAS_L[wday(today())]} · ${pend.length} por visitar de ${p.items.length}`)+(pend.length?`<section class="card">${pend.map(it=>dFila(it.c.id,[it.zona,...it.why.map(w=>w.t)].map(esc).join(" · "),pill(semVisita(it.c)))).join("")}</section>`:`<div class="empty">Nada pendiente para hoy.</div>`)+`<button class="btn primary" data-tab="ruta">Ir a la ruta</button>`;
  }
  else if(k==="visitas"){
    const as=S.acts.filter(a=>dMes(a.fecha)&&dMine(a)).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const tipos=[...new Set(as.map(a=>a.tipo))].map(t=>({lab:t,segs:[{k:t,sw:"f1",nombre:t,v:as.filter(a=>a.tipo===t).length}]})).sort((a,b)=>b.segs[0].v-a.segs[0].v);
    h=dHdr("Visitas y registros",mes)+(as.length?`<section class="card stack"><h3>Por tipo</h3>${hbars(tipos,"cuenta")}</section>
      <section class="card"><h3 style="margin-bottom:4px">Registros (${as.length})</h3>${as.map(a=>dFila(a.clienteId,`${fdate(a.fecha)} · ${esc(a.tipo)}${(a.muestras||[]).length?" · con muestras":""}`,a.resultado?`<span class="chip">${esc(a.resultado)}</span>`:"")).join("")}</section>`:`<div class="empty">Sin visitas registradas en ${mes}.</div>`);
  }
  else if(k==="muestras"){
    const as=S.acts.filter(a=>dMes(a.fecha)&&dMine(a)&&(a.muestras||[]).length).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const mu=as.flatMap(a=>a.muestras.map(m=>({...m,clienteId:a.clienteId,fecha:a.fecha})));
    const vari=[...new Set(mu.map(m=>m.marca+"|"+m.nombre))].map(key=>{const[mk,nom]=key.split("|");return{lab:nom,segs:[{k:mk,sw:MARCA_SW[mk],nombre:mk,v:mu.filter(m=>m.marca===mk&&m.nombre===nom).reduce((s,m)=>s+m.cant,0)}]}}).sort((a,b)=>b.segs[0].v-a.segs[0].v);
    h=dHdr("Muestras entregadas",mes)+(as.length?`<section class="card stack"><h3>Por variedad</h3>${hbars(vari,"cuenta")}</section>
      <section class="card"><h3 style="margin-bottom:4px">A quién (${as.length})</h3>${as.map(a=>dFila(a.clienteId,`${fdate(a.fecha)} · ${a.muestras.map(m=>`${n1(m.cant)} ${esc(m.nombre)}`).join(", ")}`,a.resultado?`<span class="chip">${esc(a.resultado)}</span>`:"")).join("")}</section>`:`<div class="empty">No entregaste muestras en ${mes}.</div>`);
  }
  else if(k==="conversion"){
    const desde=addDays(today(),-60),act=S.acts.filter(a=>a.fecha>=desde&&(a.tipo==="Activación / degustación"||(a.muestras||[]).length));
    const ids=[...new Set(act.map(a=>a.clienteId))].map(id=>{const first=act.filter(a=>a.clienteId===id).map(a=>a.fecha).sort()[0];const compra=ventasDe(id).filter(v=>v.fecha>=first).map(v=>v.fecha).sort()[0];return{id,first,compra}}).sort((a,b)=>(!!a.compra)-(!!b.compra)||a.first.localeCompare(b.first));
    const conv=ids.filter(x=>x.compra).length;
    h=dHdr("Conversión 60 días",`${conv} de ${ids.length} clientes activados compraron`)+(ids.length?`<section class="card">${ids.map(x=>dFila(x.id,`Activado el ${fdate(x.first)}${x.compra?` · compró el ${fdate(x.compra)} (${days(x.first,x.compra)} días después)`:` · hace ${days(x.first,today())} días`}`,pill(x.compra?{level:"ok",short:"Compró"}:{level:"warn",short:"Aún no"}))).join("")}</section>
      <div class="muted small">Primero aparecen los que aún no compran: son los que conviene visitar.</div>`:`<div class="empty">No hubo activaciones ni muestras en los últimos 60 días.</div>`);
  }
  openSheet(`<div class="drill stack">${h}</div>`);
}

/* análisis de compras en la ficha del cliente */
function analisisCliente(cl){
  const vs=ventasDe(cl.id).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")),plata=can("ver_cobranza");
  const catalogo=[...new Set(S.cfg.productos.filter(p=>(cl.marcas||[]).includes(p.marca)).map(p=>p.estilo).filter(Boolean))];
  if(!vs.length)return `<div class="card stack" style="gap:6px"><h3>Compras</h3><div class="muted small">Aún no compra.${catalogo.length?` Para partir, ofrécele: ${catalogo.slice(0,4).map(esc).join(", ")}.`:""}</div></div>`;
  const L=vs.flatMap(v=>(v.items||[]).map(it=>({marca:v.marca,...infoItem(it),cant:it.cant||0,litros:(it.cant||0)*(it.litrosU||0),neto:(it.cant||0)*(it.netoU||0),venta:v.id})));
  const litros=sumM(L,"litros"),neto=sumM(L,"neto");
  const fechas=[...new Set(vs.map(v=>v.fecha).filter(Boolean))].sort();
  const cada=fechas.length>1?days(fechas[0],fechas.at(-1))/(fechas.length-1):null,hace=days(fechas.at(-1),today());
  const prods=[...new Set(L.map(r=>r.marca+"|"+r.estilo+"|"+r.formato))].map(k=>{const[mk,e,f]=k.split("|"),rs=L.filter(r=>r.marca===mk&&r.estilo===e&&r.formato===f);
    return{mk,lab:`${e} · ${FORMATOS[f]||f}`,estilo:e,litros:sumM(rs,"litros"),cant:sumM(rs,"cant"),veces:new Set(rs.map(r=>r.venta)).size}}).sort((a,b)=>b.litros-a.litros);
  const comprados=new Set(prods.map(p=>p.estilo)),nunca=catalogo.filter(e=>!comprados.has(e));
  const meses=[];for(let i=5;i>=0;i--)meses.push(shiftMes(today().slice(0,7),-i));
  const porMes=meses.map(m=>({lab:mesLabel(m),segs:["cerveza","kombucha"].map(mk=>({k:mk,sw:MARCA_SW[mk],nombre:mk==="cerveza"?"Cerveza":"Kombucha",v:sumM(L.filter(r=>r.marca===mk&&vs.find(v=>v.id===r.venta)?.fecha?.slice(0,7)===m),"litros")}))}));
  const pag=vs.filter(v=>v.pagado&&v.fechaPago),diasPago=pag.length?pag.reduce((s,v)=>s+Math.max(0,days(v.fecha,v.fechaPago)),0)/pag.length:null;
  const menos=prods.length>1?prods.at(-1):null;
  return `<div class="card stack"><h3>Compras</h3>
    <div class="kpis">
      <div class="kpi"><span class="lab">Compras</span><span class="val">${vs.length}</span><span class="muted small">${n1(litros)} L en total</span></div>
      <div class="kpi"><span class="lab">Frecuencia</span><span class="val">${cada===null?"—":"cada "+Math.round(cada)+" d"}</span><span class="muted small">Última hace ${hace} días</span></div>
      ${plata?`<div class="kpi"><span class="lab">Ticket promedio</span><span class="val">${money(neto/vs.length)}</span><span class="muted small">${money(neto)} neto en total</span></div>`:""}
      ${diasPago!==null?`<div class="kpi"><span class="lab">Paga en</span><span class="val">${n1(diasPago)} días</span><span class="muted small">promedio</span></div>`:""}
    </div>
    <div class="stack" style="gap:4px">
      <div class="small"><b>Lo que más compra:</b> ${esc(prods[0].lab)} (${n1(prods[0].litros)} L en ${prods[0].veces} ${prods[0].veces===1?"compra":"compras"})</div>
      ${menos?`<div class="small"><b>Lo que menos compra:</b> ${esc(menos.lab)} (${n1(menos.litros)} L)</div>`:""}
      ${nunca.length?`<div class="small"><b>Nunca ha comprado:</b> ${nunca.slice(0,5).map(esc).join(", ")} · para ofrecerle</div>`:""}
    </div>
    <div><div class="muted small" style="margin-bottom:4px">Productos (litros)</div>${hbars(prods.map(p=>({lab:p.lab,act:"drill",arg:"estilo:"+p.mk+"|"+p.estilo,segs:[{k:p.mk,sw:MARCA_SW[p.mk],nombre:p.mk,v:p.litros}]})),"litros")}</div>

/* ---------- sheets ---------- */
function openSheet(html,detailId=null){S.openDetail=detailId;$("#modal").innerHTML=`<div class="overlay" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=$("#modal input,#modal select");if(f&&window.innerWidth>700&&!detailId)f.focus();if(SB)mostrarFotos($("#modal"))}
function closeSheet(){S.openDetail=null;S.pila=[];$("#modal").innerHTML="";tipHide?.()}

function actLine(a){
  const mu=(a.muestras||[]).map(m=>`${n1(m.cant)} ${esc(m.nombre)}`).join(", ");
  return `<div class="act"><div class="row spread"><b>${fdate(a.fecha)} · ${esc(a.tipo)}</b><span class="row" style="gap:6px">${a.resultado?`<span class="chip">${esc(a.resultado)}</span>`:""}<button class="btn sm" data-act="editAct" data-id="${a.id}">Editar</button></span></div>${mu?`<div class="small">Muestras: ${mu}</div>`:""}${a.nota?`<div class="small muted" style="white-space:pre-wrap">${esc(a.nota)}</div>`:""}</div>`;
}

  <div class="card stack" style="gap:6px">
   ${cl.contacto?`<div><span class="muted small">Contacto</span><div>${esc(cl.contacto)}</div></div>`:""}
   ${cl.telefono?`<div><span class="muted small">Teléfono</span><div class="num">${esc(cl.telefono)}</div></div>`:""}
   ${cl.foto?`<img class="fotoloc" data-foto="${esc(cl.foto)}" alt="Foto del local">`:""}
   ${cl.direccion||cl.gps?`<div><span class="muted small">Dirección del local</span><div class="row"><span>${esc(cl.direccion||"")}</span><a class="btn sm" href="${mapsUrl(cl)}" target="_blank" rel="noopener">Mapa</a>${cl.gps?`<a class="btn sm" href="${mapsUrl(cl,true)}" target="_blank" rel="noopener">Cómo llegar</a><span class="chip">📍 GPS</span>`:""}</div></div>`:""}

   <div class="row" style="gap:24px">${can("ver_cobranza")?`<div><span class="muted small">Por cobrar (con IVA)</span><div class="num">${money(deuda)}</div></div>`:""}<div><span class="muted small">Muestras entregadas</span><div class="small">${Object.keys(muTot).length?Object.entries(muTot).map(([k,v])=>n1(v)+" "+esc(k)).join(", "):"—"}</div></div></div>
  </div>
  ${analisisCliente(cl)}
  <h3>Visitas y activaciones (${as.length})</h3>

  const sh=$("#modal .sheet");if(sh)sh.scrollTop=sc;
}

];
const SB=(window.CARTERA_CONFIG&&window.supabase&&!/PEGA_AQUI/.test(window.CARTERA_CONFIG.url))?window.supabase.createClient(window.CARTERA_CONFIG.url,window.CARTERA_CONFIG.anonKey):null;
const ME={user:null,perfil:null};
const isAdmin=()=>ME.perfil?.rol==="admin"&&ME.perfil?.activo;
const can=p=>isAdmin()||!!(ME.perfil?.activo&&ME.perfil?.permisos?.[p]);

const ownerOf=c=>c.asignado_a||c.creado_por;
const KEYCACHE=()=>"cartera-cache-"+(ME.user?.id||"");
/* Catálogo antiguo: un producto juntaba varios estilos ("Barril 30 L · Red / IPA").
   Se reemplaza por uno por estilo, conservando el precio que tenía cada grupo. */
const PROD_ANTIGUO={"b-pil":["b30-pil","b30-sol","b30-amb"],"b-ipa":["b30-red","b30-ipa"],"b-bip":["b30-bip"],"c-pil":["c24-pil","c24-sol"],"c-ipa":["c24-red","c24-ipa","c24-bip"],"k-17":["k24-ps","k24-tc","k24-gb"],"k-19":["k24-db","k24-el"]};
function infoDeNombre(nombre=""){
  return{formato:/barril/i.test(nombre)?"barril":/caja/i.test(nombre)?"caja":/lata/i.test(nombre)?"lata":"otro",
    estilo:nombre.includes(" · ")?nombre.split(" · ").pop():nombre};
}
function migrarProductos(ps){
  if(!ps)return null;
  if(ps.some(p=>p.formato))return ps;
  const nuevos=structuredClone(DEFAULT_CFG.productos),otros=[];
  ps.forEach(p=>{const ids=PROD_ANTIGUO[p.id];if(ids)nuevos.forEach(n=>{if(ids.includes(n.id))n.neto=p.neto});else otros.push({...p,...infoDeNombre(p.nombre)})});
  return[...nuevos,...otros];
}
function mergeCfg(d){
  const D=structuredClone(DEFAULT_CFG);d=d||{};
  return{...D,...structuredClone(d),frec:{...D.frec,...(d.frec||{})},plazo:{...D.plazo,...(d.plazo||{})},frecVisita:{...D.frecVisita,...(d.frecVisita||{})},
    zonas:d.zonas||D.zonas,zonasDia:{...D.zonasDia,...(d.zonasDia||{})},muestras:d.muestras||D.muestras,productos:migrarProductos(d.productos)||D.productos,
    prefs:{permitir:{...D.prefs.permitir,...(d.prefs?.permitir||{})},defecto:{...D.prefs.defecto,...(d.prefs?.defecto||{})}}};
}
const strip=o=>{const{id,clienteId,asignado_a,creado_por,actualizado,...rest}=o;return rest};
const fromCliente=r=>({...r.data,id:r.id,asignado_a:r.asignado_a,creado_por:r.creado_por});
const fromHijo=r=>({...r.data,id:r.id,clienteId:r.cliente_id,creado_por:r.creado_por});
async function fetchAll(table){
  const out=[];let from=0;
  for(;;){const{data,error}=await SB.from(table).select("*").range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}
  return out;
}
async function loadAll(){
  const[{data:perfil,error:pe},cl,ve,ac,{data:cfg},{data:eq}]=await Promise.all([
    SB.from("perfiles").select("*").eq("id",ME.user.id).maybeSingle(),
    fetchAll("clientes").catch(()=>[]),fetchAll("ventas").catch(()=>[]),fetchAll("actividades").catch(()=>[]),
    SB.from("config").select("data").eq("id",1).maybeSingle(),SB.rpc("equipo")]);
  if(pe)throw pe;
  ME.perfil=perfil;
  S.clientes=cl.map(fromCliente);S.ventas=ve.map(fromHijo);S.acts=ac.map(fromHijo);
  S.cfg=mergeCfg(cfg?.data);S.equipo=eq||[];
  S.perfiles=isAdmin()?((await SB.from("perfiles").select("*").order("creado")).data||[]):[];
  S.offline=false;
  try{localStorage.setItem(KEYCACHE(),JSON.stringify({perfil,clientes:S.clientes,ventas:S.ventas,acts:S.acts,cfg:S.cfg,equipo:S.equipo,t:new Date().toISOString()}))}catch(e){}
}
function loadCache(){
  try{const d=JSON.parse(localStorage.getItem(KEYCACHE())||"null");if(!d)return false;
    ME.perfil=d.perfil;S.clientes=d.clientes;S.ventas=d.ventas;S.acts=d.acts;S.cfg=mergeCfg(d.cfg);S.equipo=d.equipo||[];S.cacheT=d.t;return true}catch(e){return false}
}
const TBL={clientes:"clientes",ventas:"ventas",actividades:"actividades"};
const LOCAL={clientes:"clientes",ventas:"ventas",actividades:"acts"};
function rowFor(col,data){
  if(col==="clientes"){const r={data:strip(data)};if("asignado_a" in data)r.asignado_a=data.asignado_a||null;return r}
  return{cliente_id:data.clienteId,data:strip(data)};
}
async function chk(p){const{error}=await p;if(error)throw error}
const DB={
  add:(col,data)=>chk(SB.from(TBL[col]).insert(rowFor(col,data))),
  set:(col,id,data)=>chk(SB.from(TBL[col]).update(rowFor(col,data)).eq("id",id)),
  update:(col,id,patch)=>{const cur=S[LOCAL[col]].find(x=>x.id===id);if(!cur)throw new Error("Registro no encontrado");return DB.set(col,id,{...cur,...patch})},
  delete:(col,id)=>chk(SB.from(TBL[col]).delete().eq("id",id)),
  setCfg:cfg=>chk(SB.from("config").update({data:cfg}).eq("id",1))
};
function errMsg(e){
  const m=e?.message||"";
  if(S.offline||/Failed to fetch|NetworkError|network/i.test(m))return"Sin conexión: no se guardó. Intenta cuando tengas señal.";
  if(e?.code==="42501"||/row-level security/i.test(m))return"No tienes permiso para hacer esto";
  if(e?.code==="P0001")return m;
  return"No se pudo guardar: "+m;
}
function refresh(){
  const editing=(S.tab==="ajustes"&&document.activeElement?.closest?.("#cfgForm"))||(S.tab==="equipo"&&document.activeElement?.closest?.(".userCard"));
  if(!editing)render();
  if(S.openDetail&&$("#modal").innerHTML)clientDetail(S.openDetail);
}
async function guard(fn,okMsg){
  if(S.offline){toast("Sin conexión: por ahora solo puedes mirar");return false}
  try{await fn();if(okMsg)toast(okMsg);}
  catch(e){toast(errMsg(e));try{await loadAll()}catch(_){ }refresh();return false}
  try{await loadAll()}catch(e){}
  refresh();return true;
}

function descargar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

  toast("Respaldo descargado");
}
function csv(rows){return rows.map(r=>r.map(v=>{const t=String(v??"");return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}).join(";")).join("\n")}
function exportarCSV(){

    ...S.clientes.map(c=>[c.nombre,c.estado,impOf(c),c.tipo,c.zona,(c.marcas||[]).join(" + "),nombreDe(ownerOf(c)),c.contacto,c.telefono,c.direccion,c.horario,c.proxFecha,c.proxTexto,c.notas,c.razonSocial,c.rutEmpresa,c.giro,c.email,c.dueno,c.rutDueno,c.telDueno,c.emailDueno])];

async function importarRespaldo(file){
  if(!isAdmin()){toast("Solo el administrador puede cargar respaldos");return}
  let d;try{d=JSON.parse(await file.text());if(d.app!=="cartera-valdivia")throw 0}catch(e){toast("Ese archivo no es un respaldo de Cartera Valdivia");return}
  const ok=await guard(async()=>{
    const map={};
    for(const c of d.clientes||[]){const{data,error}=await SB.from("clientes").insert({data:strip(c),asignado_a:ME.user.id}).select("id").single();if(error)throw error;map[c.id]=data.id}
    const hijos=(arr,t)=>arr.filter(x=>map[x.clienteId]).map(x=>({cliente_id:map[x.clienteId],data:strip(x)}));
    const v=hijos(d.ventas||[]),a=hijos(d.acts||[]);
    for(let i=0;i<v.length;i+=500)await chk(SB.from("ventas").insert(v.slice(i,i+500)));
    for(let i=0;i<a.length;i+=500)await chk(SB.from("actividades").insert(a.slice(i,i+500)));
  },`Respaldo cargado: ${(d.clientes||[]).length} clientes, ${(d.ventas||[]).length} ventas`);
  if(ok)render();
}

async function guardarUsuario(f){

document.addEventListener("submit",async e=>{

  if(f.id==="authForm"){
    const email=$("#auEmail").value.trim(),pw=$("#auPw").value,btn=f.querySelector("button[type=submit]");btn.disabled=true;

      const{data,error}=await SB.auth.signUp({email,password:pw,options:{data:{nombre:$("#auNombre").value.trim()}}});
      btn.disabled=false;
      if(error){authScreen("registro",error.message.includes("registered")?"Ese correo ya tiene cuenta. Entra con tu contraseña.":"No se pudo crear la cuenta: "+error.message);return}
      if(!data.session){authScreen("login","Cuenta creada. Revisa tu correo para confirmarla y luego entra.");return}
      ME.user=data.session.user;afterLogin();
    }else{
      const{data,error}=await SB.auth.signInWithPassword({email,password:pw});
      btn.disabled=false;
      if(error){authScreen("login",/Invalid login/i.test(error.message)?"Correo o contraseña incorrectos.":/confirm/i.test(error.message)?"Primero confirma tu correo (revisa tu bandeja de entrada).":(/fetch/i.test(error.message)?"No se pudo conectar con la base de datos. Revisa tu internet o los datos de config.js.":"No se pudo entrar: "+error.message));return}
      ME.user=data.user;afterLogin();
    }

  }

  }

  if(f.id==="perfilForm"){
    const nombre=$("#pfNombre").value.trim();if(!nombre){toast("Escribe tu nombre");return}

    return;
  }
  if(f.id==="claveForm"){
    const btn=f.querySelector("button");btn.disabled=true;
    const{error}=await SB.auth.updateUser({password:$("#pfClave").value});
    btn.disabled=false;
    if(error){toast("No se pudo cambiar: "+error.message);return}
    $("#pfClave").value="";toast("Contraseña actualizada");return;
  }
  if(f.id==="prefsAdmin"){
    const permitir={},defecto={};
    f.querySelectorAll("[data-permitir]").forEach(x=>permitir[x.dataset.permitir]=x.checked);
    f.querySelectorAll("[data-defecto]").forEach(x=>defecto[x.dataset.defecto]=x.value);
    S.cfg.prefs={permitir,defecto};
    if(await guard(()=>DB.setCfg(structuredClone(S.cfg)),"Guardado para todos")){aplicarPrefs();menuSheet()}
    return;
  }
  const val=id=>document.getElementById(id).value.trim();
  if(f.id==="clientForm"){
    const marcas=[$("#mC").checked&&"cerveza",$("#mK").checked&&"kombucha"].filter(Boolean);
    const diasVisita=[...document.querySelectorAll("[data-dv]")].filter(x=>x.checked).map(x=>Number(x.dataset.dv));
    const data={nombre:val("cNombre"),tipo:val("cTipo"),estado:val("cEstado"),importancia:val("cImp"),zona:val("cZona"),marcas,diasVisita,horario:val("cHorario"),frecVisita:Number(val("cFrecV"))||null,
      contacto:val("cContacto"),telefono:val("cTel"),direccion:val("cDir"),
      frec:{cerveza:Number(val("cFrecC"))||null,kombucha:Number(val("cFrecK"))||null},proxFecha:val("cProxF"),proxTexto:val("cProxT"),notas:val("cNotas")};
    if($("#cAsig"))data.asignado_a=$("#cAsig").value;
    if(!data.nombre){toast("Falta el nombre del local");return}
    const rutEmp=rutLimpio(val("cRutEmp")),rutDueno=rutLimpio(val("cRutDueno"));
    if(rutEmp===null){toast("El RUT de la empresa no es válido");$("#cRutEmp").focus();return}
    if(rutDueno===null){toast("El RUT del dueño no es válido");$("#cRutDueno").focus();return}
    const mailOk=s=>!s||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
    if(!mailOk(val("cEmail"))||!mailOk(val("cEmailDueno"))){toast("Revisa el email: no parece válido");return}

    if(gps===undefined){toast("La ubicación GPS no es válida. Usa \"Estoy aquí\" o pega coordenadas");$("#cGps").focus();return}
    Object.assign(data,{razonSocial:val("cRazon"),rutEmpresa:rutEmp,giro:val("cGiro"),dirFacturacion:val("cDirFact"),email:val("cEmail"),dueno:val("cDueno"),rutDueno,telDueno:val("cTelDueno"),emailDueno:val("cEmailDueno"),
      recepcion:val("cRecep"),gps});
    if(!marcas.length){toast("Marca al menos una: cerveza o kombucha");return}

    }

    const cid=val("aCli");if(!cid){toast("Elige el cliente");return}
    const muestras=readMu();
    const data={clienteId:cid,fecha:val("aFecha")||today(),tipo:val("aTipo"),muestras,resultado:val("aRes"),nota:val("aNota")};
    const proxF=val("aProxF"),proxT=val("aProxT");
    const aid=f.dataset.id;
    const ok=await guard(async()=>{
      if(aid)await DB.set("actividades",aid,data);else await DB.add("actividades",data);
      const cl=S.clientes.find(c=>c.id===cid);
      if(cl){const upd={};
        if(proxF){upd.proxFecha=proxF;upd.proxTexto=proxT||cl.proxTexto||""}
        else if(cl.proxFecha&&cl.proxFecha<=data.fecha&&PRESENCIAL.has(data.tipo)){upd.proxFecha="";upd.proxTexto=""}
        if(data.resultado==="No interesado"&&cl.estado==="prospecto")upd.estado="pausado";
        const mks=[...new Set(muestras.map(m=>m.marca))].filter(m=>!(cl.marcas||[]).includes(m));if(mks.length)upd.marcas=[...(cl.marcas||[]),...mks];
        if(Object.keys(upd).length)await DB.update("clientes",cid,upd)}
    },"Visita guardada");
    if(ok){if(S.openDetail===null&&S.tab!=="ruta")clientDetail(cid);else closeSheet()}
  }
  if(f.id==="saleForm"){
    const it=readLines();const cid=$("#sCli").value;const m=$("#sMarca").value;
    if(!cid){toast("Elige el cliente");return}
    if(!it.length){toast("Agrega al menos un producto con cantidad");return}
    const pag=$("#sPag").checked;const old=f.dataset.id?S.ventas.find(v=>v.id===f.dataset.id):null;
    const data={clienteId:cid,marca:m,fecha:$("#sFecha").value||today(),vence:$("#sVence").value||$("#sFecha").value,factura:$("#sFact").value.trim(),nota:$("#sNota").value.trim(),items:it,
      litros:Math.round(it.reduce((s,x)=>s+x.cant*x.litrosU,0)*100)/100,cajas:m==="kombucha"?it.reduce((s,x)=>s+x.cant,0):0,neto:it.reduce((s,x)=>s+x.cant*x.netoU,0),
      pagado:pag,fechaPago:pag?(old?.fechaPago||today()):""};
    const ok=await guard(async()=>{
      if(old)await DB.set("ventas",old.id,data);else await DB.add("ventas",data);
      const cl=S.clientes.find(c=>c.id===cid);
      if(cl){const upd={};if(cl.estado==="prospecto")upd.estado="activo";if(!(cl.marcas||[]).includes(m))upd.marcas=[...(cl.marcas||[]),m];if(Object.keys(upd).length)await DB.update("clientes",cid,upd)}
    },"Venta guardada");
    if(ok)closeSheet();
  }
  if(f.id==="cfgForm"){collectCfgForm();await guard(()=>DB.setCfg(structuredClone(S.cfg)),"Ajustes guardados");render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeSheet()});

/* globo de los gráficos: aparece al pasar el mouse o al tocar/enfocar una barra */
const tipEl=document.createElement("div");tipEl.className="tip";tipEl.hidden=true;tipEl.setAttribute("role","status");document.body.appendChild(tipEl);
function tipShow(el,x,y){
  if(tipEl._el!==el){tipEl._el=el;tipEl.textContent=el.dataset.tip}
  tipEl.hidden=false;const r=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.max(8,Math.min(x+12,innerWidth-r.width-8))+"px";
  tipEl.style.top=(y-r.height-12<8?y+18:y-r.height-12)+"px";
}
function tipHide(){tipEl.hidden=true;tipEl._el=null}
document.addEventListener("mousemove",e=>{const el=e.target.closest?.("[data-tip]");el?tipShow(el,e.clientX,e.clientY):tipHide()});
const tipFoco=el=>{const r=el.getBoundingClientRect();tipShow(el,r.left+r.width/2,r.top)};
document.addEventListener("focusin",e=>{const el=e.target.closest?.("[data-tip]");el?tipFoco(el):tipHide()});
document.addEventListener("focusout",tipHide);
document.addEventListener("scroll",()=>{const el=tipEl._el;el&&el===document.activeElement?tipFoco(el):tipHide()},true);

function trTxt(s){
  if(Object.hasOwn(EN,s))return EN[s];
  for(const[rx,f]of EN_RX){const m=s.match(rx);if(m)return f(m)}
  for(const sep of[" · ",": "]){const i=s.indexOf(sep);
    if(i>0){const a=s.slice(0,i),b=s.slice(i+sep.length),ta=trTxt(a),tb=trTxt(b);if(ta!==null||tb!==null)return(ta??a)+sep+(tb??b)}}
  return null;
}
const NOTR="textarea,script,style,[data-notr]";
function trNodo(n){
  if(n.nodeType===3){
    const p=n.parentElement;if(!p||p.closest(NOTR))return;
    const v=n.nodeValue,s=v.trim();if(!s)return;
    const t=trTxt(s);if(t!==null&&t!==s)n.nodeValue=v.replace(s,()=>t);
    return;
  }
  if(n.nodeType!==1||n.closest("script,style,[data-notr]"))return;
  [n,...n.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(el=>{if(el.closest("[data-notr]"))return;
    ["placeholder","aria-label","title"].forEach(a=>{const v=el.getAttribute(a);if(v){const t=trTxt(v.trim());if(t!==null)el.setAttribute(a,t)}})});
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(trNodo);
}
if(LANG==="en"){trNodo(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNodo))).observe(document.body,{childList:true,subtree:true})}
